<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Peerborne distinct-identity invitation and live peer sync</title>
  <desc id="description">Browser A creates a signed editor invitation. Browser B accepts with a separate identity, receives a recipient-encrypted Welcome through Circuit Relay, loads retained history, and sends a live mutation back. Each browser builds a local client-side index; distributed candidate search is explicitly marked incomplete.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.55" stop-color="#101634"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#0d192a"/>
    </linearGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211d50"/>
      <stop offset="1" stop-color="#111e32"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c7d2fe" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020617" flood-opacity=".65"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .local-edit { animation: reveal-edit 10s ease-out 1 both; }
      .security { animation: reveal-security 10s ease-out 1 both; }
      .active-path { animation: reveal-path 10s ease-out 1 both; }
      .packet { opacity:0; transform:translate(298px,228px); transform-box: fill-box; transform-origin: center; animation: move-packet 10s ease-in-out 1 both; }
      .packet-return { opacity:0; transform:translate(648px,228px); transform-box: fill-box; transform-origin: center; animation: move-return-packet 10s ease-in-out 1 both; }
      .relay-card { animation: pulse-relay 10s ease-in-out 1 both; }
      .key-note { animation: reveal-key 10s ease-out 1 both; }
      .waiting { opacity:0; animation: hide-waiting 10s linear 1 both; }
      .remote-document { animation: reveal-remote 10s ease-out 1 both; }
      .loaded-history { animation: reveal-loaded 10s ease-out 1 both; }
      .remote-edit { animation: reveal-remote-edit 10s ease-out 1 both; }
      .return-edit { animation: reveal-return-edit 10s ease-out 1 both; }
      .index-a { animation: reveal-index-a 10s ease-out 1 both; }
      .index-b { animation: reveal-index-b 10s ease-out 1 both; }
      .no-server { animation: reveal-no-server 10s ease-out 1 both; }
      .search-gap { animation: reveal-search-gap 10s ease-out 1 both; }
      @keyframes reveal-edit { 0%,14% { opacity:0 } 22%,100% { opacity:1 } }
      @keyframes reveal-security { 0%,20% { opacity:0 } 29%,100% { opacity:1 } }
      @keyframes reveal-path { 0%,28% { stroke-dashoffset:365 } 47%,100% { stroke-dashoffset:0 } }
      @keyframes move-packet { 0%,27% { opacity:0; transform:translate(298px,228px) } 32% { opacity:1 } 43% { opacity:1; transform:translate(466px,228px) rotate(8deg) } 51% { opacity:1; transform:translate(466px,228px) rotate(-8deg) } 62% { opacity:1; transform:translate(648px,228px) } 66%,100% { opacity:0; transform:translate(648px,228px) } }
      @keyframes move-return-packet { 0%,70% { opacity:0; transform:translate(648px,228px) } 74% { opacity:1 } 82% { opacity:1; transform:translate(466px,228px) rotate(-8deg) } 87% { opacity:1; transform:translate(298px,228px) } 91%,100% { opacity:0; transform:translate(298px,228px) } }
      @keyframes pulse-relay { 0%,30%,72%,100% { stroke:#818cf8 } 43%,61% { stroke:#2dd4bf } }
      @keyframes reveal-key { 0%,43% { opacity:0 } 51%,100% { opacity:1 } }
      @keyframes hide-waiting { 0%,56% { opacity:1 } 64%,100% { opacity:0 } }
      @keyframes reveal-remote { 0%,58% { opacity:.18 } 66%,100% { opacity:1 } }
      @keyframes reveal-loaded { 0%,58% { opacity:0 } 66%,100% { opacity:1 } }
      @keyframes reveal-remote-edit { 0%,67% { opacity:0 } 74%,100% { opacity:1 } }
      @keyframes reveal-return-edit { 0%,85% { opacity:0 } 92%,100% { opacity:1 } }
      @keyframes reveal-index-a { 0%,85% { opacity:0 } 93%,100% { opacity:1 } }
      @keyframes reveal-index-b { 0%,68% { opacity:0 } 76%,100% { opacity:1 } }
      @keyframes reveal-no-server { 0%,84% { opacity:0 } 94%,100% { opacity:1 } }
      @keyframes reveal-search-gap { 0%,88% { opacity:0 } 97%,100% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .local-edit,.security,.active-path,.packet,.packet-return,.relay-card,.key-note,.waiting,.remote-document,.loaded-history,.remote-edit,.return-edit,.index-a,.index-b,.no-server,.search-gap { animation:none !important; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#background)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <g transform="translate(28 20)">
    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#2dd4bf" stroke-width="2" transform="rotate(45 12 12)"/>
    <rect x="9" y="9" width="6" height="6" rx="2" fill="#818cf8" transform="rotate(45 12 12)"/>
    <text x="35" y="17" fill="#99f6e4" font-size="15" font-weight="800" letter-spacing="2.4">PEERBORNE</text>
    <text x="0" y="52" fill="#f8fafc" font-size="25" font-weight="760">Signed invite → encrypted join → live peer sync</text>
  </g>
  <g transform="translate(712 25)">
    <rect width="220" height="31" rx="15.5" fill="#172554" fill-opacity=".8" stroke="#6366f1"/>
    <text x="110" y="20" fill="#c7d2fe" font-size="10.5" font-weight="800" letter-spacing="1" text-anchor="middle">DISTINCT BROWSERS · VIA RELAY</text>
  </g>

  <g aria-label="Browser A behind NAT A">
    <rect x="26" y="107" width="267" height="270" rx="25" fill="#0b1727" fill-opacity=".72" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="41" y="118" width="61" height="22" rx="11" fill="#0f302f" stroke="#2dd4bf" stroke-opacity=".5"/>
    <text x="71.5" y="133" fill="#99f6e4" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">NAT A</text>
    <rect x="41" y="147" width="237" height="215" rx="20" fill="url(#card)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
    <g transform="translate(58 166)">
      <rect width="43" height="32" rx="6" fill="none" stroke="#5eead4" stroke-width="2"/>
      <path d="M5 24h33M15 39h13" fill="none" stroke="#5eead4" stroke-width="2"/>
      <text x="54" y="15" fill="#f8fafc" font-size="17" font-weight="760">Browser A</text>
      <text x="54" y="32" fill="#94a3b8" font-size="11">Founder · signing identity A</text>
    </g>
    <g transform="translate(56 220)">
      <rect width="207" height="65" rx="13" fill="#07111f" stroke="#334155"/>
      <text x="12" y="19" fill="#a5b4fc" font-size="11" font-weight="700" class="mono">/shared-note</text>
      <g class="local-edit">
        <text x="12" y="39" fill="#cbd5e1" font-size="10.5" class="mono">fromA</text>
        <text x="195" y="39" fill="#5eead4" font-size="10.5" font-weight="700" text-anchor="end" class="mono">alice</text>
      </g>
      <g class="return-edit">
        <text x="12" y="56" fill="#cbd5e1" font-size="10.5" class="mono">fromB</text>
        <text x="195" y="56" fill="#a5b4fc" font-size="10.5" font-weight="700" text-anchor="end" class="mono">bob</text>
      </g>
    </g>
    <g class="local-edit" transform="translate(56 297)">
      <rect width="207" height="28" rx="8" fill="#0f302f"/>
      <text x="103.5" y="18" fill="#5eead4" font-size="10" font-weight="800" letter-spacing=".7" text-anchor="middle">SIGNED INVITE CREATED</text>
    </g>
  </g>

  <g aria-label="Browser B behind NAT B">
    <rect x="667" y="107" width="267" height="270" rx="25" fill="#0b1727" fill-opacity=".72" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="682" y="118" width="61" height="22" rx="11" fill="#0f302f" stroke="#2dd4bf" stroke-opacity=".5"/>
    <text x="712.5" y="133" fill="#99f6e4" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">NAT B</text>
    <rect x="682" y="147" width="237" height="215" rx="20" fill="url(#card)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
    <g transform="translate(699 166)">
      <rect width="43" height="32" rx="6" fill="none" stroke="#5eead4" stroke-width="2"/>
      <path d="M5 24h33M15 39h13" fill="none" stroke="#5eead4" stroke-width="2"/>
      <text x="54" y="15" fill="#f8fafc" font-size="17" font-weight="760">Browser B</text>
      <text x="54" y="32" fill="#94a3b8" font-size="11">Invitee · signing identity B</text>
    </g>
    <g class="remote-document" transform="translate(697 220)">
      <rect width="207" height="65" rx="13" fill="#07111f" stroke="#334155"/>
      <text x="12" y="19" fill="#a5b4fc" font-size="11" font-weight="700" class="mono">/shared-note</text>
      <text x="12" y="39" fill="#cbd5e1" font-size="10.5" class="mono">fromA</text>
      <text x="195" y="39" fill="#5eead4" font-size="10.5" font-weight="700" text-anchor="end" class="mono">alice</text>
      <g class="remote-edit">
        <text x="12" y="56" fill="#cbd5e1" font-size="10.5" class="mono">fromB</text>
        <text x="195" y="56" fill="#a5b4fc" font-size="10.5" font-weight="700" text-anchor="end" class="mono">bob</text>
      </g>
    </g>
    <text class="waiting" x="697" y="323" fill="#64748b" font-size="11">Waiting for existing document history…</text>
    <g class="loaded-history" transform="translate(697 299)">
      <circle cx="7.5" cy="7.5" r="7.5" fill="#0f766e"/><path d="m4 7.5 2.2 2.2L11.5 4.5" fill="none" stroke="#ecfeff" stroke-width="1.5"/>
      <text x="22" y="11" fill="#99f6e4" font-size="11">decrypt Welcome + history</text>
      <circle cx="7.5" cy="28.5" r="7.5" fill="#0f766e"/><path d="m4 28.5 2.2 2.2 5.3-5.2" fill="none" stroke="#ecfeff" stroke-width="1.5"/>
      <text x="22" y="32" fill="#99f6e4" font-size="11">publish live editor mutation</text>
    </g>
  </g>

  <g class="security" transform="translate(307 104)">
    <rect width="171" height="25" rx="12.5" fill="#0c2a2c" stroke="#2dd4bf" stroke-opacity=".55"/>
    <text x="85.5" y="16" fill="#99f6e4" font-size="8.1" font-weight="850" letter-spacing=".25" text-anchor="middle">SIGNED EDITOR INVITATION</text>
    <rect x="179" width="167" height="25" rx="12.5" fill="#0c2a2c" stroke="#2dd4bf" stroke-opacity=".55"/>
    <text x="262.5" y="16" fill="#99f6e4" font-size="8.1" font-weight="850" letter-spacing=".25" text-anchor="middle">RECIPIENT-ENCRYPTED WELCOME</text>
  </g>

  <path d="M293 244H667" fill="none" stroke="#1e4f50" stroke-width="5"/>
  <path class="active-path" d="M293 244H667" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-dasharray="365" stroke-dashoffset="0" filter="url(#glow)"/>
  <path d="m658 236 12 8-12 8" fill="#2dd4bf"/>

  <g>
    <rect class="relay-card" x="354" y="151" width="252" height="178" rx="24" fill="url(#relay)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
    <g transform="translate(456 169) rotate(45 24 24)">
      <rect width="48" height="48" rx="16" fill="none" stroke="#a5b4fc" stroke-width="2"/>
      <circle cx="24" cy="24" r="8" fill="#818cf8" filter="url(#glow)"/>
    </g>
    <text x="480" y="246" fill="#f8fafc" font-size="20" font-weight="780" text-anchor="middle">Circuit Relay</text>
    <text x="480" y="266" fill="#c7d2fe" font-size="11" text-anchor="middle">forwards encrypted invitation + sync traffic</text>
    <text x="480" y="284" fill="#94a3b8" font-size="11" text-anchor="middle">sees peer IDs, timing, and volume</text>
    <text x="480" y="303" fill="#5eead4" font-size="10" font-weight="800" letter-spacing=".8" text-anchor="middle">NOT DOCUMENT PLAINTEXT</text>
  </g>

  <g class="packet">
    <rect width="31" height="31" rx="9" fill="#0f766e" stroke="#99f6e4" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M9 11h13v10H9zM12 8h7v3" fill="none" stroke="#ecfeff" stroke-width="1.5"/>
  </g>

  <g class="packet-return">
    <rect width="31" height="31" rx="9" fill="#4338ca" stroke="#c7d2fe" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M22 11H9v10h13zM19 8h-7v3" fill="none" stroke="#eef2ff" stroke-width="1.5"/>
  </g>

  <g class="key-note" transform="translate(327 337)">
    <rect width="306" height="35" rx="12" fill="#171b35" stroke="#6366f1"/>
    <text x="153" y="22" fill="#c7d2fe" font-size="10" text-anchor="middle"><tspan fill="#e0e7ff" font-weight="800" letter-spacing=".6">DISTINCT IDENTITIES</tspan><tspan> · signed offer grants editor role</tspan></text>
  </g>

  <g class="index-a" transform="translate(26 393)">
    <rect width="267" height="66" rx="15" fill="#0b1728" fill-opacity=".92" stroke="#334155"/>
    <text x="13" y="21" fill="#99f6e4" font-size="9" font-weight="850" letter-spacing=".8">CLIENT-SIDE INDEX A · TESTED PRIMITIVES</text>
    <text x="13" y="45" fill="#cbd5e1" font-size="11" class="mono">/shared-note</text>
    <text x="254" y="45" fill="#5eead4" font-size="11" font-weight="700" text-anchor="end" class="mono">1 local result</text>
  </g>
  <g class="no-server" transform="translate(316 393)">
    <rect width="328" height="66" rx="15" fill="#10192b" stroke="#475569"/>
    <text x="164" y="29" fill="#f8fafc" font-size="12" font-weight="800" letter-spacing=".5" text-anchor="middle">NO APPLICATION DATABASE</text>
    <text x="164" y="47" fill="#94a3b8" font-size="10" text-anchor="middle">no central search server</text>
  </g>
  <g class="index-b" transform="translate(667 393)">
    <rect width="267" height="66" rx="15" fill="#0b1728" fill-opacity=".92" stroke="#334155"/>
    <text x="13" y="21" fill="#99f6e4" font-size="9" font-weight="850" letter-spacing=".8">CLIENT-SIDE INDEX B · TESTED PRIMITIVES</text>
    <text x="13" y="45" fill="#cbd5e1" font-size="11" class="mono">/shared-note</text>
    <text x="254" y="45" fill="#5eead4" font-size="11" font-weight="700" text-anchor="end" class="mono">1 local result</text>
  </g>
  <g class="search-gap" transform="translate(316 466)">
    <rect width="328" height="22" rx="11" fill="#3b2712" fill-opacity=".55" stroke="#f59e0b" stroke-opacity=".7" stroke-dasharray="4 3"/>
    <text x="164" y="15" fill="#fcd34d" font-size="9" font-weight="850" letter-spacing=".55" text-anchor="middle">DISTRIBUTED SEARCH · INCOMPLETE / NOT DEMONSTRATED</text>
  </g>

  <g transform="translate(20 493)">
    <rect width="920" height="39" rx="13" fill="#0b1524" fill-opacity=".95" stroke="#334155"/>
    <text x="460" y="15" fill="#94a3b8" font-size="9.7" text-anchor="middle"><tspan fill="#5eead4" font-weight="800" letter-spacing=".4">CI-BACKED BOUNDARY</tspan><tspan> · two NAT-isolated browsers · distinct identities · signed invitation</tspan></text>
    <text x="460" y="29" fill="#94a3b8" font-size="9.7" text-anchor="middle">Encrypted Welcome · live bidirectional relay sync · local index primitives tested separately</text>
  </g>
</svg>

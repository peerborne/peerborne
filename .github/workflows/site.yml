name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      - 'docs/feature-audit.md'
      - 'examples/**'
      - 'AGENTS.md'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'yarn.lock'
      - '.tool-versions'
      - '.yarnrc.yml'
      - '.yarn/releases/yarn-4.5.0.cjs'
  pull_request:
    paths:
      - 'site/**'
      - 'packages/**'
      - 'docs/feature-audit.md'
      - 'examples/**'
      - 'AGENTS.md'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'yarn.lock'
      - '.tool-versions'
      - '.yarnrc.yml'
      - '.yarn/releases/yarn-4.5.0.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build site
        run: yarn workspace @peerborne/site build
      - name: Test site tooling
        run: node --test site/scripts/check-links.test.mjs site/scripts/generate-llms-full.test.mjs
      - name: Check site and agent index links
        run: node site/scripts/check-links.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

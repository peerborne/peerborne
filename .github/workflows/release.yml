name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'RELEASING.md'
      - 'scripts/publish-release.tests.mjs'
      - 'scripts/release-*.mjs'
      - 'scripts/prepare-release.mjs'
      - 'scripts/publish-release.mjs'
      - 'scripts/set-version.mjs'
      - 'scripts/tag-release.sh'
      - 'scripts/validate-release-consumer.mjs'
      - 'verification/release/**'
      - 'e2e/integrations.spec.ts'
      - 'e2e/integration-cases.json'
      - 'e2e/peerborne-note*.spec.ts'
      - 'e2e/release-recovery.spec.ts'
      - 'examples/integrations/**'
      - 'examples/peerborne-note/**'
      - 'examples/nextjs/**'
      - 'examples/tanstack-start/**'
      - 'examples/shared/**'
      - 'relay-server/**'
      - 'package.json'
      - 'yarn.lock'
      - 'packages/*/package.json'
      - 'packages/*/.npmignore'
      - 'packages/*/README.md'
      - 'packages/*/LICENSE'
      - 'packages/*/src/**'
      - 'packages/*/bin/**'
      - 'packages/*/tsconfig*.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --force --prune origin main
          VERSION="$(node scripts/release-version.mjs)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
      - run: corepack enable
      - run: npm install --global npm@11.21.1
      - run: yarn install --immutable
      - run: yarn test:release
      - run: yarn build
      - run: yarn test:serial
      - run: yarn exec playwright install chromium firefox webkit --with-deps
      - run: yarn --cwd relay-server install --immutable
      - run: yarn --cwd relay-server build
      - name: Pack and inspect release artifacts
        run: yarn release:prepare "$RUNNER_TEMP/peerborne-release"
      - name: Validate clean external consumer
        run: yarn release:validate-consumer "$RUNNER_TEMP/peerborne-release" "$RUNNER_TEMP"
        env:
          PEERBORNE_RELEASE_BROWSERS: chromium,firefox,webkit
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/peerborne-release/*.tgz
            ${{ runner.temp }}/peerborne-release/release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/release/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: validate-artifacts
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/peerborne-release
      - name: Authenticate bootstrap publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if test -n "$NODE_AUTH_TOKEN"; then
            npm whoami
          else
            echo "Using npm trusted publishing through GitHub Actions OIDC."
          fi
      - name: Stage, verify, and promote packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STAGING_TAG: peerborne-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/release-version.mjs)"
          BASE_VERSION="${VERSION%%+*}"
          TARGET_TAG=latest
          case "$BASE_VERSION" in *-*) TARGET_TAG=next ;; esac
          node scripts/publish-release.mjs "$RUNNER_TEMP/peerborne-release" "$STAGING_TAG" "$TARGET_TAG"

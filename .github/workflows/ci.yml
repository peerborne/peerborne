name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Technical verification workload size
        type: choice
        default: smoke
        options: [smoke, full]
      topology:
        description: Native WebRTC graph (the full mesh may exceed Chromium limits)
        type: choice
        default: mesh
        options: [mesh, ring]

permissions:
  contents: read

jobs:
  formal-verification:
    name: Formal policy verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
      - name: Install pinned proof tools
        run: node verification/formal/setup.mjs
      - name: Verify production policies and audit proof assumptions
        run: node verification/formal/run.mjs
      - name: Check counterexamples and proof escape controls
        run: node verification/formal/controls.mjs
      - name: Inventory first-party verification scope
        run: node verification/formal/inventory.mjs
      - name: Upload formal verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-verification
          path: verification/results/formal/
          retention-days: 30

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn visuals:test
      - run: yarn build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - yjs
          - react
          - automerge
          - redux
          - index
          - store
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Build workspace packages
        run: yarn build
      - run: yarn workspace @peerborne/${{ matrix.package }} test

  relay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
      - run: yarn --cwd relay-server install --immutable
      - run: yarn --cwd relay-server build
      - run: yarn --cwd relay-server test

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn exec playwright install chromium --with-deps
      - run: yarn build
      - run: yarn workspace @peerborne/peerborne-note build:deployment
        env:
          VITE_PEERBORNE_RELAY_MULTIADDR: /dns4/relay.example.invalid/tcp/443/wss/p2p/12D3KooWRqEojevLXwbPxiAvDaK4HbCUXip6rSzrhWurUBdgwFGT
      - run: yarn test:peerborne-note
      - run: yarn test:password-manager
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: example-test-results
          path: test-results/
          retention-days: 30

  technical-verification:
    name: Technical verification (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PEERBORNE_VERIFY_PROFILE: ${{ inputs.profile || 'smoke' }}
      PEERBORNE_VERIFY_TOPOLOGY: ${{ inputs.topology || 'mesh' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build workspace packages
        id: build
        run: yarn build
      - name: Run CRDT and epoch diagnostics
        run: node --expose-gc verification/run.mjs --profile "$PEERBORNE_VERIFY_PROFILE"
      - name: Run advanced crypto and adversarial diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --expose-gc verification/advanced/run.mjs --profile "$PEERBORNE_VERIFY_PROFILE"
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: yarn exec playwright install chromium --with-deps
      - name: Run Chromium storage and WebRTC diagnostics
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: yarn exec playwright test --config=verification/playwright.config.ts
      - name: Run advanced browser diagnostics
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: yarn exec playwright test --config=verification/advanced/playwright.config.ts
      - name: Verify native SCTP loss in an isolated Linux namespace
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: bash verification/advanced/run-kernel-loss.sh
      - name: Collect advanced observations
        if: always()
        run: node verification/advanced/collect.mjs --profile "$PEERBORNE_VERIFY_PROFILE"
      - name: Collect capability gaps
        if: always()
        run: node verification/collect.mjs --profile "$PEERBORNE_VERIFY_PROFILE"
      - name: Upload technical verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technical-verification-${{ env.PEERBORNE_VERIFY_PROFILE }}-${{ env.PEERBORNE_VERIFY_TOPOLOGY }}
          path: verification/results/
          retention-days: 30

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Playwright Browsers
        run: yarn exec playwright install chromium --with-deps
      - name: Build and start services
        run: |
          docker compose -f docker-compose.integration.yaml build
          docker compose -f docker-compose.integration.yaml up -d
      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:3001 > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -f http://localhost:3002 > /dev/null 2>&1; do sleep 2; done'
      - name: Run integration tests
        run: yarn test:integration
        env:
          CI: true
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yaml logs
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.integration.yaml down -v

  nat-traversal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Playwright Browsers
        run: yarn exec playwright install chromium --with-deps
      - name: Build and start NAT-isolated services
        run: |
          docker compose -f docker-compose.nat-test.yaml build
          docker compose -f docker-compose.nat-test.yaml up -d
      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:3001 > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -f http://localhost:3002 > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -f http://localhost:3003 > /dev/null 2>&1; do sleep 2; done'
      - name: Run NAT traversal tests
        run: yarn test:nat
        env:
          CI: true
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nat-test-playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.nat-test.yaml logs
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.nat-test.yaml down -v

  peerborne-cross-nat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Start two NAT-isolated browsers and real Peerborne apps
        run: docker compose -f docker-compose.peerborne-nat.yaml up -d --build
      - name: Wait for remote Playwright endpoints
        run: node scripts/wait-remote-chromium.mjs ws://127.0.0.1:3101/ ws://127.0.0.1:3102/
      - name: Prove bidirectional encrypted convergence across NAT boundary
        run: yarn test:peerborne-nat
        env:
          CI: true
      - name: Profile encrypted Circuit Relay transfer
        run: yarn verify:technical:nat
        env:
          CI: true
      - name: Upload relay verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technical-verification-relay
          path: verification/results/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: peerborne-cross-nat-report
          path: playwright-report/
          retention-days: 30
      - name: Show service logs
        if: failure()
        run: docker compose -f docker-compose.peerborne-nat.yaml logs
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.peerborne-nat.yaml down -v

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Build workspace packages
        run: yarn build
      - name: Run benchmarks
        run: yarn benchmark:ci
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

  frontend-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn exec playwright install chromium --with-deps
      - run: yarn test:e2e:integrations
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-integration-traces
          path: test-results/

# Peerborne two-relay identity routing example
#
# Caddy routes a distinct WSS hostname to each relay's persistent identity.
# Both relays run on one machine. Inter-relay peering is configured separately.
#
# Usage:
#   docker compose -f guides/docker/docker-compose.production.yaml up -d
#
# Prerequisites:
#   - The default hostnames are relay-1.localhost and relay-2.localhost
#   - Public staging requires two unique DNS names (RELAY_1_DOMAIN and
#     RELAY_2_DOMAIN), a public RELAY_BIND_ADDRESS, and access to ports 80/443
#   - The 172.30.0.0/24 network below must not overlap another Docker network;
#     if it does, change the subnet, Caddy's address and TRUSTED_PROXY_IPS

services:
  # Reverse proxy with automatic TLS
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - RELAY_1_DOMAIN
      - RELAY_2_DOMAIN
    networks:
      relay:
        # The relays exempt only this address from GossipSub IP scoring.
        ipv4_address: 172.30.0.2

  # Primary relay / bootstrap node
  relay-1:
    build:
      context: ../../relay-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:9002:9002"
    volumes:
      - relay-1-data:/shared
    networks:
      - relay
    environment:
      # Every browser arrives from Caddy's address. Trusting only that address
      # keeps GossipSub IP scoring for peers that dial TCP 9002 directly.
      # Enforce per-client limits in Caddy.
      - TRUSTED_PROXY_IPS=172.30.0.2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Secondary relay with its own persistent identity
  relay-2:
    build:
      context: ../../relay-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:9012:9002"
    volumes:
      - relay-2-data:/shared
    networks:
      - relay
    environment:
      - TRUSTED_PROXY_IPS=172.30.0.2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  relay:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
  relay-1-data:
  relay-2-data:

# Fly.io deployment configuration for the Peerborne relay server.
#
# Usage:
#   cd relay-server
#   fly launch --no-deploy   # imports this file; set your app name when prompted
#   fly volumes create peerborne_relay_data --region iad --size 1
#   fly deploy
#
# Change the app name and primary_region below before deploying.
# Run `fly platform regions` to see all available regions; pick the one
# closest to your users.

app = "peerborne-relay"            # TODO: change to a unique name, e.g. "myapp-relay"
primary_region = "iad"           # US East (Virginia); change to your nearest region

[build]
  dockerfile = "Dockerfile"      # relay-server/Dockerfile (build context = relay-server/)

[deploy]
  strategy = "rolling"

[mounts]
  source = "peerborne_relay_data"
  destination = "/data"

# Browser peers dial WSS on 443. Fly terminates TLS, then forwards the intact
# WebSocket HTTP Upgrade to the relay's plain WebSocket listener on port 9001.
[[services]]
  protocol = "tcp"
  internal_port = 9001
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 256
    soft_limit = 220

  [[services.tcp_checks]]
    interval = "10s"
    timeout  = "5s"
    grace_period = "30s"

[checks]
  [checks.relay_ready]
    type = "http"
    port = 9000
    method = "get"
    path = "/readyz"
    interval = "10s"
    timeout = "3s"
    grace_period = "30s"

[env]
  RELAY_IDENTITY_KEY_PATH = "/data/relay-identity.key"
  READINESS_PORT = "9000"
  TOPIC_ALLOWLIST = "/document/,/documents"
  MAX_AUTO_TOPICS = "1000"
  MAX_AUTO_TOPICS_PER_PEER = "32"
  GOSSIPSUB_MAX_TOPIC_BYTES_PER_PEER = "65536"
  MAX_CONNECTIONS = "256"
  RELAY_MAX_RESERVATIONS = "128"
  RELAY_RESERVATION_TTL_MS = "600000"
  RELAY_MAX_CIRCUIT_DURATION_MS = "1800000"
  RELAY_MAX_CIRCUIT_BYTES = "16777216"
  RELAY_HOP_TIMEOUT_MS = "30000"
  RELAY_MAX_INBOUND_HOP_STREAMS = "8"
  RELAY_MAX_OUTBOUND_HOP_STREAMS = "8"
  RELAY_MAX_OUTBOUND_STOP_STREAMS = "8"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

version: '3.7'
services:
  relay:
    build: ./relay-server
    ports:
      - 9001:9001
      - 9002:9002
    volumes:
      - shared-data:/shared
    healthcheck:
      test: ["CMD", "node", "-e", "const net = require('net'); const s = net.createConnection(9001, '127.0.0.1', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  browser-test:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: peerborne-automerge:latest
      # If rebuild-on-save is not working, try uncommenting the following (may increase CPU usage of system and prevent sleeping):
      # - "CHOKIDAR_USEPOLLING=true"
    ports:
      - 3001:3000
    volumes:
      - ./packages/core/src:/app/packages/core/src
      - ./packages/automerge/bin:/app/packages/automerge/bin
      - ./packages/automerge/src:/app/packages/automerge/src
      - ./packages/redux/src:/app/packages/redux/src
      - ./examples/browser-test/public:/app/examples/browser-test/public
      - ./examples/browser-test/src:/app/examples/browser-test/src
      - shared-data:/shared:ro
    stdin_open: true
    depends_on:
      relay:
        condition: service_healthy
    # Extract the relay's WebSocket multiaddr from shared relay-info.json
    # and pass it via VITE_RELAY_MULTIADDR so the Vite app can
    # use it as a bootstrap peer for libp2p peer discovery.
    command:
      - sh
      - -c
      - |
        VITE_RELAY_MULTIADDR=$$(cat /shared/relay-info.json | sed -n 's/.*"wsMultiaddr"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        export VITE_RELAY_MULTIADDR
        echo "Relay multiaddr: $$VITE_RELAY_MULTIADDR"
        exec yarn workspace @peerborne/browser-test start --host 0.0.0.0 --port 3000

  wiki-swarm:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: peerborne-automerge:latest
      # If rebuild-on-save is not working, try uncommenting the following (may increase CPU usage of system and prevent sleeping):
      # - "CHOKIDAR_USEPOLLING=true"
    ports:
      - 3000:3000
    volumes:
      - ./packages/core/src:/app/packages/core/src
      - ./packages/automerge/bin:/app/packages/automerge/bin
      - ./packages/automerge/src:/app/packages/automerge/src
      - ./packages/redux/src:/app/packages/redux/src
      - ./examples/wiki-swarm/public:/app/examples/wiki-swarm/public
      - ./examples/wiki-swarm/src:/app/examples/wiki-swarm/src
      - shared-data:/shared:ro
    stdin_open: true
    depends_on:
      relay:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        VITE_RELAY_MULTIADDR=$$(cat /shared/relay-info.json | sed -n 's/.*"wsMultiaddr"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        export VITE_RELAY_MULTIADDR
        echo "Relay multiaddr: $$VITE_RELAY_MULTIADDR"
        exec yarn workspace @peerborne/wiki-swarm start --host 0.0.0.0 --port 3000

  node:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: peerborne-automerge:latest
    environment:
      - 'CLIENT_CONFIG_FILE=/app/client-config.env'
      # If rebuild-on-save is not working, try uncommenting the following (may increase CPU usage of system and prevent sleeping):
      # - "CHOKIDAR_USEPOLLING=true"
    ports:
      - 4001:4001
      - 4002:4002
      - 4003:4003
    volumes:
      - ./packages/core/src:/app/packages/core/src
      - ./packages/automerge/bin:/app/packages/automerge/bin
      - ./packages/automerge/src:/app/packages/automerge/src
    depends_on:
      relay:
        condition: service_healthy

volumes:
  shared-data:

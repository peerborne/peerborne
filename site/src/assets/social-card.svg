<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Peerborne</title>
  <desc id="description">Encrypted, local-first CRDT documents over peer-to-peer networks. Alpha software.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d1a" />
      <stop offset="0.55" stop-color="#111936" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientTransform="translate(258 302) rotate(30) scale(390 365)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientTransform="translate(1030 82) rotate(135) scale(310 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity="0.2" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#c7d2fe" stroke-opacity="0.055" />
    </pattern>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#tealGlow)" />

  <g opacity="0.2" stroke="#2dd4bf" stroke-width="2">
    <path d="M36 118L132 73L215 123" />
    <path d="M986 527L1080 477L1178 522" />
    <path d="M1058 172L1143 217" />
  </g>
  <g fill="#2dd4bf" opacity="0.7">
    <circle cx="36" cy="118" r="5" />
    <circle cx="132" cy="73" r="5" />
    <circle cx="215" cy="123" r="5" />
    <circle cx="986" cy="527" r="5" />
    <circle cx="1080" cy="477" r="5" />
    <circle cx="1178" cy="522" r="5" />
    <circle cx="1058" cy="172" r="5" />
    <circle cx="1143" cy="217" r="5" />
  </g>

  <g transform="translate(78 145) scale(2.55)">
    <g stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.58">
      <line x1="64" y1="64" x2="64" y2="22" />
      <line x1="64" y1="64" x2="27.6" y2="43" />
      <line x1="64" y1="64" x2="27.6" y2="85" />
      <line x1="64" y1="64" x2="64" y2="106" />
      <line x1="64" y1="64" x2="100.4" y2="85" />
      <line x1="64" y1="64" x2="100.4" y2="43" />
      <line x1="64" y1="22" x2="27.6" y2="43" />
      <line x1="27.6" y1="43" x2="27.6" y2="85" />
      <line x1="27.6" y1="85" x2="64" y2="106" />
      <line x1="64" y1="106" x2="100.4" y2="85" />
      <line x1="100.4" y1="85" x2="100.4" y2="43" />
      <line x1="100.4" y1="43" x2="64" y2="22" />
    </g>
    <g filter="url(#nodeGlow)">
      <circle cx="64" cy="22" r="9" fill="#2dd4bf" />
      <circle cx="27.6" cy="43" r="9" fill="#2dd4bf" />
      <circle cx="27.6" cy="85" r="9" fill="#2dd4bf" />
      <circle cx="64" cy="106" r="9" fill="#2dd4bf" />
      <circle cx="100.4" cy="85" r="9" fill="#2dd4bf" />
      <circle cx="100.4" cy="43" r="9" fill="#2dd4bf" />
      <circle cx="64" cy="64" r="13" fill="#818cf8" />
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="466" y="118" fill="#99f6e4" font-size="25" font-weight="700" letter-spacing="5">PEERBORNE</text>
    <rect x="1019" y="78" width="111" height="44" rx="22" fill="#312e81" stroke="#818cf8" />
    <text x="1074.5" y="107" fill="#e0e7ff" font-size="17" font-weight="700" letter-spacing="2.5" text-anchor="middle">ALPHA</text>

    <text x="466" y="221" fill="#f8fafc" font-size="65" font-weight="740" letter-spacing="-1.5">Encrypted,</text>
    <text x="466" y="301" fill="#f8fafc" font-size="65" font-weight="740" letter-spacing="-1.5">local-first</text>
    <text x="466" y="381" fill="#f8fafc" font-size="65" font-weight="740" letter-spacing="-1.5">CRDT documents</text>

    <line x1="466" y1="437" x2="1130" y2="437" stroke="#6366f1" stroke-opacity="0.7" />
    <text x="466" y="496" fill="#cbd5e1" font-size="27" font-weight="500">State carried peer to peer for TypeScript</text>
    <text x="466" y="545" fill="#94a3b8" font-size="21">Open source · ready to explore · not production-ready</text>
  </g>

  <rect x="0" y="624" width="1200" height="6" fill="#2dd4bf" />
</svg>

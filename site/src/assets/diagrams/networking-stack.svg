<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="networking-stack-title networking-stack-description">
  <title id="networking-stack-title">Peer-to-peer networking stack</title>
  <desc id="networking-stack-description">Layer diagram from application through Peerborne core, libp2p, and Helia. WebSocket through Circuit Relay and GossipSub live mutations are verified in the dedicated cross-NAT browser path. WebRTC, WebRTC Direct, ICE, DCUtR, AutoNAT, bootstrap, and Kademlia have partial evidence. WebTransport is configured but lacks a successful synchronization assertion. Bootstrap and PubSub peer discovery are configured, and the Node default additionally uses LAN-broadcast mDNS. IPNS support is limited to DHT record validators and selectors. Browser defaults use IndexedDB stores; Node defaults use process-local in-memory stores and allow custom stores.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c7d2fe" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#818cf8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 760; }
      .subtitle { fill: #94a3b8; font-size: 17px; }
      .eyebrow { font-size: 15px; font-weight: 760; letter-spacing: 1.25px; }
      .section { fill: #e2e8f0; font-size: 16px; font-weight: 740; letter-spacing: .5px; }
      .card-title { fill: #f8fafc; font-size: 19px; font-weight: 740; }
      .body { fill: #cbd5e1; font-size: 15px; }
      .body-strong { fill: #e2e8f0; font-size: 15px; font-weight: 700; }
      .badge { font-size: 15px; font-weight: 760; letter-spacing: .35px; }
      .node { fill: #f8fafc; font-size: 18px; font-weight: 760; }
      .node-detail { fill: #cbd5e1; font-size: 15px; }
      .number { fill: #0f172a; font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="930" rx="28" fill="url(#background)"/>
  <rect width="1200" height="930" rx="28" fill="url(#grid)"/>
  <path d="M0 28A28 28 0 0 1 28 0H1172A28 28 0 0 1 1200 28V34H0Z" fill="#2dd4bf"/>
  <g>
    <text x="50" y="69" class="title">Peer-to-peer networking stack</text>
    <text x="50" y="99" class="subtitle">Configured components and current automated evidence are shown separately.</text>

    <rect x="664" y="51" width="154" height="34" rx="17" fill="#0f2b2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="741" y="74" class="badge" text-anchor="middle" fill="#99f6e4">VERIFIED PATH</text>
    <rect x="830" y="51" width="158" height="34" rx="17" fill="#3b2b13" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="909" y="74" class="badge" text-anchor="middle" fill="#fde68a">PARTIAL EVIDENCE</text>
    <rect x="1000" y="51" width="150" height="34" rx="17" fill="#271b42" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1075" y="74" class="badge" text-anchor="middle" fill="#ddd6fe">CONFIGURED ONLY</text>

    <rect x="50" y="136" width="1100" height="70" rx="18" fill="#132e35" stroke="#14b8a6" stroke-width="2"/>
    <text x="76" y="166" class="eyebrow" fill="#5eead4">APPLICATION</text>
    <text x="250" y="169" class="body">Calls the document API; owns user identity and key persistence.</text>

    <rect x="50" y="226" width="1100" height="88" rx="18" fill="#17213a" stroke="#6366f1" stroke-width="2"/>
    <text x="76" y="258" class="eyebrow" fill="#a5b4fc">PEERBORNE CORE</text>
    <text x="250" y="257" class="body-strong">Document lifecycle · ACL · encryption · shadow sync graph</text>
    <text x="250" y="284" class="body">Coordinates configured Helia and libp2p services; does not replace their protocols.</text>
    <path d="M600 206V218" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="50" y="334" width="1100" height="384" rx="18" fill="#101a2c" stroke="#475569" stroke-width="2"/>
    <text x="76" y="369" class="eyebrow" fill="#c7d2fe">LIBP2P NETWORKING</text>
    <text x="1030" y="369" class="body-strong" text-anchor="end">Noise + yamux</text>

    <text x="76" y="410" class="section">TRANSPORTS</text>
    <rect x="76" y="426" width="326" height="104" rx="18" fill="#0f2b2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="98" y="458" class="card-title">WebSocket + Circuit Relay v2</text>
    <text x="98" y="484" class="body">Cross-NAT live sync path</text>
    <rect x="98" y="495" width="144" height="34" rx="17" fill="#123a3d" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="170" y="518" class="badge" text-anchor="middle" fill="#99f6e4">VERIFIED PATH</text>
    <rect x="437" y="426" width="326" height="104" rx="18" fill="#2d2518" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="459" y="458" class="card-title">WebRTC + WebRTC Direct</text>
    <text x="459" y="484" class="body">ICE uses configured STUN / TURN</text>
    <rect x="459" y="495" width="158" height="34" rx="17" fill="#3b2b13" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="538" y="518" class="badge" text-anchor="middle" fill="#fde68a">PARTIAL EVIDENCE</text>
    <rect x="798" y="426" width="326" height="104" rx="18" fill="#251b3b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="820" y="458" class="card-title">WebTransport</text>
    <text x="820" y="484" class="body">Present in default transport config</text>
    <rect x="820" y="495" width="150" height="34" rx="17" fill="#32224e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="895" y="518" class="badge" text-anchor="middle" fill="#ddd6fe">CONFIGURED ONLY</text>

    <text x="76" y="572" class="section">DISCOVERY, ROUTING, AND SERVICES</text>
    <rect x="76" y="588" width="326" height="102" rx="18" fill="#2d2518" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="98" y="619" class="card-title">Discovery + client DHT</text>
    <text x="98" y="644" class="body">Bootstrap when set + PubSub discovery</text>
<text x="98" y="665" class="body">Node default adds LAN-broadcast mDNS</text>
<text x="98" y="686" class="body">DHT client: IPNS validator / selector only</text>
    <rect x="437" y="588" width="326" height="102" rx="18" fill="#0f2b2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="459" y="619" class="card-title">GossipSub document topics</text>
    <text x="459" y="645" class="body">Fresh mutations are exercised across the</text>
<text x="459" y="667" class="body">dedicated relay-backed browser topology.</text>
    <rect x="798" y="588" width="326" height="102" rx="18" fill="#2d2518" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="820" y="619" class="card-title">DCUtR + AutoNAT + ICE</text>
    <text x="820" y="645" class="body">Configured and component-tested; direct-path</text>
<text x="820" y="667" class="body">and authenticated TURN coverage is incomplete.</text>
    <path d="M600 314V326" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="50" y="738" width="1100" height="91" rx="18" fill="#121f31" stroke="#475569" stroke-width="2"/>
    <text x="76" y="770" class="eyebrow" fill="#93c5fd">HELIA / CONTENT-ADDRESSED STORAGE</text>
    <text x="76" y="796" class="body-strong">Browser default</text>
    <text x="430" y="796" class="body-strong">Node default</text>
    <text x="870" y="796" class="body-strong">Both</text>
    <text x="76" y="819" class="body">IndexedDB blockstore + datastore</text>
    <text x="430" y="819" class="body">Process-local in-memory stores; custom stores supported</text>
    <text x="870" y="819" class="body">Bitswap + CID validation</text>
    <path d="M600 718V730" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="50" y="849" width="1100" height="54" rx="18" fill="#111d2e" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="882" class="body" text-anchor="middle">Evidence labels describe current automated coverage—not every capability of the configured protocols.</text>
  </g>
</svg>

    <text x="50" y="99" class="subtitle">Configured components and current automated evidence are shown separately.</text>

    <rect x="664" y="51" width="154" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="741" y="74" class="badge" text-anchor="middle" fill="#c7f5d3">VERIFIED PATH</text>
    <rect x="830" y="51" width="158" height="34" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="0" y="0" class="badge" text-anchor="middle" fill="#ffd5b5" transform="translate(909 74) scale(0.99162 1)">PARTIAL EVIDENCE</text>
    <rect x="1000" y="51" width="150" height="34" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="1075" y="74" class="badge" text-anchor="middle" fill="#d6c8ff">CONFIGURED ONLY</text>

    <rect x="50" y="136" width="1100" height="70" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="76" y="166" class="eyebrow" fill="#a3efb8">APPLICATION</text>
    <text x="250" y="169" class="body">Calls the document API; owns user identity and key persistence.</text>

    <rect x="50" y="226" width="1100" height="88" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="76" y="258" class="eyebrow" fill="#b7a1ff">PEERBORNE CORE</text>
    <text x="250" y="257" class="body-strong">Document lifecycle · ACL · encryption · shadow sync graph</text>
    <text x="250" y="284" class="body">Coordinates configured Helia and libp2p services; does not replace their protocols.</text>
    <path d="M600 206V218" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="50" y="334" width="1100" height="384" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="76" y="369" class="eyebrow" fill="#d6c8ff">LIBP2P NETWORKING</text>
    <text x="1030" y="369" class="body-strong" text-anchor="end">Noise + yamux</text>

    <text x="76" y="410" class="section">TRANSPORTS</text>
    <rect x="76" y="426" width="326" height="104" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="0" y="0" class="card-title" transform="translate(98 458) scale(0.90226 1)">WebSocket + Circuit Relay v2</text>
    <text x="98" y="484" class="body">Cross-NAT live sync path</text>
    <rect x="98" y="495" width="144" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="170" y="518" class="badge" text-anchor="middle" fill="#c7f5d3">VERIFIED PATH</text>
    <rect x="437" y="426" width="326" height="104" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="459" y="458" class="card-title">WebRTC + WebRTC Direct</text>
    <text x="459" y="484" class="body">ICE uses configured STUN / TURN</text>
    <rect x="459" y="495" width="158" height="34" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="0" y="0" class="badge" text-anchor="middle" fill="#ffd5b5" transform="translate(538 518) scale(0.99162 1)">PARTIAL EVIDENCE</text>
    <rect x="798" y="426" width="326" height="104" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="820" y="458" class="card-title">WebTransport</text>
    <text x="0" y="0" class="body" transform="translate(820 484) scale(0.91429 1)">Present in default transport config</text>
    <rect x="820" y="495" width="150" height="34" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="895" y="518" class="badge" text-anchor="middle" fill="#d6c8ff">CONFIGURED ONLY</text>

    <text x="76" y="572" class="section">DISCOVERY, ROUTING, AND SERVICES</text>
    <rect x="76" y="588" width="326" height="102" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="98" y="619" class="card-title">Discovery + client DHT</text>
    <text x="0" y="0" class="body" transform="translate(98 644) scale(0.86486 1)">Bootstrap when set + PubSub discovery</text>
<text x="0" y="0" class="body" transform="translate(98 665) scale(0.88889 1)">Node default adds LAN-broadcast mDNS</text>
<text x="0" y="0" class="body" transform="translate(98 686) scale(0.76190 1)">DHT client: IPNS validator / selector only</text>
    <rect x="437" y="588" width="326" height="102" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="459" y="619" class="card-title">GossipSub document topics</text>
    <text x="0" y="0" class="body" transform="translate(459 645) scale(0.80000 1)">Fresh mutations are exercised across the</text>
<text x="0" y="0" class="body" transform="translate(459 667) scale(0.80000 1)">dedicated relay-backed browser topology.</text>
    <rect x="798" y="588" width="326" height="102" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="820" y="619" class="card-title">DCUtR + AutoNAT + ICE</text>
    <text x="0" y="0" class="body" transform="translate(820 645) scale(0.72727 1)">Configured and component-tested; direct-path</text>
<text x="0" y="0" class="body" transform="translate(820 667) scale(0.69565 1)">and authenticated TURN coverage is incomplete.</text>
    <path d="M600 314V326" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="50" y="738" width="1100" height="91" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="76" y="770" class="eyebrow" fill="#b7a1ff">HELIA / CONTENT-ADDRESSED STORAGE</text>
    <text x="76" y="796" class="body-strong">Browser default</text>
    <text x="430" y="796" class="body-strong">Node default</text>
    <text x="870" y="796" class="body-strong">Both</text>
    <text x="76" y="819" class="body">IndexedDB blockstore + datastore</text>
    <text x="0" y="0" class="body" transform="translate(430 819) scale(0.86869 1)">Process-local in-memory stores; custom stores supported</text>
    <text x="870" y="819" class="body">Bitswap + CID validation</text>
    <path d="M600 718V730" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="50" y="849" width="1100" height="54" fill="#242136" stroke="#40394f" stroke-width="1.5"/>
    <text x="600" y="882" class="body" text-anchor="middle">Evidence labels describe current automated coverage—not every capability of the configured protocols.</text>

    <text x="0" y="0" class="subtitle" transform="translate(50 99) scale(0.97523 1)">Each relay has its own DNS and TLS endpoint; Peerborne does not provide a mesh or automatic failover between them.</text>

    <rect x="844" y="51" width="306" height="34" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="997" y="74" class="badge" text-anchor="middle" fill="#ffd5b5">NO BUILT-IN MESH OR FAILOVER</text>
    <text x="50" y="142" class="eyebrow" fill="#a3efb8">INDEPENDENT RELAY ENDPOINTS</text>
    <rect x="50" y="170" width="300" height="174" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="200" y="208" class="card-title" text-anchor="middle">Relay US</text>
    <text x="200" y="238" class="body-strong" text-anchor="middle">relay-us.example.com</text>
    <text x="200" y="266" class="body" text-anchor="middle">US region</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(200 294) scale(0.84795 1)">WSS for browsers · TCP for relay peers</text>
    <rect x="107" y="307" width="186" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="200" y="330" class="badge" text-anchor="middle" fill="#c7f5d3">OWN DNS + TLS</text>
    <rect x="450" y="170" width="300" height="174" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="600" y="208" class="card-title" text-anchor="middle">Relay EU</text>
    <text x="600" y="238" class="body-strong" text-anchor="middle">relay-eu.example.com</text>
    <text x="600" y="266" class="body" text-anchor="middle">EU region</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(600 294) scale(0.84795 1)">WSS for browsers · TCP for relay peers</text>
    <rect x="507" y="307" width="186" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="600" y="330" class="badge" text-anchor="middle" fill="#c7f5d3">OWN DNS + TLS</text>
    <rect x="850" y="170" width="300" height="174" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="1000" y="208" class="card-title" text-anchor="middle">Relay AP</text>
    <text x="1000" y="238" class="body-strong" text-anchor="middle">relay-ap.example.com</text>
    <text x="1000" y="266" class="body" text-anchor="middle">Asia-Pacific region</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(1000 294) scale(0.84795 1)">WSS for browsers · TCP for relay peers</text>
    <rect x="907" y="307" width="186" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="1000" y="330" class="badge" text-anchor="middle" fill="#c7f5d3">OWN DNS + TLS</text>

    <rect x="50" y="548" width="1100" height="102" fill="#382819" stroke="#ffb887" stroke-width="2"/>
    <text x="76" y="582" class="eyebrow" fill="#ffd5b5">INDEPENDENT PROCESSES</text>
    <text x="76" y="614" class="body-strong">Peerborne does not ship relay-to-relay startup dialing, a supported TCP mesh, shared discovery, or client failover.</text>
    <text x="76" y="639" class="body">Any routing or peering across these processes is custom deployment code that must be implemented and verified.</text>

    <rect x="50" y="400" width="300" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="200" y="440" class="card-title" text-anchor="middle">Browser A</text>
    <text x="200" y="470" class="body" text-anchor="middle">chooses Relay US</text>
    <text x="200" y="494" class="body" text-anchor="middle">from application configuration</text>
    <rect x="450" y="400" width="300" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="600" y="440" class="card-title" text-anchor="middle">Browser B</text>
    <text x="600" y="470" class="body" text-anchor="middle">chooses Relay EU</text>
    <text x="600" y="494" class="body" text-anchor="middle">from application configuration</text>
    <rect x="850" y="400" width="300" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="1000" y="440" class="card-title" text-anchor="middle">Browser C</text>
    <text x="1000" y="470" class="body" text-anchor="middle">chooses Relay AP</text>
    <text x="1000" y="494" class="body" text-anchor="middle">from application configuration</text>

    <path d="M200 392V352" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M600 392V352" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M1000 392V352" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="50" y="730" width="1100" height="132" fill="#382237" stroke="#f0a5cf" stroke-width="2"/>
    <text x="76" y="767" class="eyebrow" fill="#f0a5cf">WHAT MULTIPLE RELAYS DO NOT AUTOMATE</text>
    <text x="0" y="0" class="body-strong" transform="translate(76 799) scale(0.96357 1)">Clients do not discover a global relay pool or fail over automatically; applications supply explicit relay multiaddresses.</text>
    <text x="76" y="826" class="body">Each relay forwards traffic only for its own established connections. Relays do not provide durable document storage.</text>
    <text x="76" y="850" class="body">Durability requires separate, application-specific publication, persistence, and recovery integration.</text>

    <rect x="50" y="890" width="1100" height="66" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="600" y="917" class="eyebrow" text-anchor="middle" fill="#b7a1ff">DEPLOYMENT BOUNDARY</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(600 941) scale(0.87130 1)">Multiple processes become a high-availability design only after custom routing, connection policy, and failover are implemented and tested.</text>
  </g>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

6h3v3h-3zM575 48h3v3h-3zM578 48h3v3h-3zM581 48h3v3h-3zM572 51h3v3h-3zM584 51h3v3h-3zM572 54h3v3h-3zM584 54h3v3h-3zM572 57h3v3h-3zM584 57h3v3h-3zM572 60h3v3h-3zM584 60h3v3h-3zM572 63h3v3h-3zM584 63h3v3h-3zM575 66h3v3h-3zM578 66h3v3h-3zM581 66h3v3h-3zM590 48h3v3h-3zM602 48h3v3h-3zM590 51h3v3h-3zM602 51h3v3h-3zM590 54h3v3h-3zM602 54h3v3h-3zM590 57h3v3h-3zM596 57h3v3h-3zM602 57h3v3h-3zM590 60h3v3h-3zM596 60h3v3h-3zM602 60h3v3h-3zM590 63h3v3h-3zM593 63h3v3h-3zM599 63h3v3h-3zM602 63h3v3h-3zM590 66h3v3h-3zM602 66h3v3h-3z" fill="#f5f0e8"/></g>
    <text x="0" y="0" class="subtitle" transform="translate(50 99) scale(0.92647 1)">Remote discovery nominates untrusted candidates; normal document security and a full local recheck remain authoritative.</text>

    <rect x="796" y="51" width="354" height="34" fill="#382819" stroke="#ffb887" stroke-width="1.5"/>
    <text x="973" y="74" class="badge" text-anchor="middle" fill="#ffd5b5">PROTOCOL + ORCHESTRATION PRIMITIVES</text>

    <rect x="150" y="137" width="900" height="92" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="600" y="172" class="card-title" text-anchor="middle">Signed collection manifest</text>
    <text x="600" y="199" class="body" text-anchor="middle">Schema hash · generation · search-key epoch · discovery mode · TTL · response budget</text>
    <text x="600" y="221" class="body" text-anchor="middle">Manager signature and monotonic sequence are validated.</text>

    <path d="M600 229V262H300V280" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M600 229V262H900V280" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <rect x="70" y="288" width="460" height="138" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="300" y="325" class="card-title" text-anchor="middle">Signed, expiring Bloom snapshot</text>
    <text x="300" y="354" class="body" text-anchor="middle">Blind equality-routing tokens only</text>
<text x="0" y="0" class="body" text-anchor="middle" transform="translate(300 378) scale(0.96154 1)">A positive match nominates a peer; it proves nothing</text>
<text x="0" y="0" class="body" text-anchor="middle" transform="translate(300 402) scale(0.90909 1)">about a document or the completeness of the result set.</text>
    <rect x="670" y="288" width="460" height="138" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="900" y="325" class="card-title" text-anchor="middle">Signed, bounded direct request</text>
    <text x="900" y="354" class="body" text-anchor="middle">Blind tokens or an explicitly disclosed query AST</text>
<text x="900" y="378" class="body" text-anchor="middle">Responses remain size-, time-, and count-bounded</text>
<text x="900" y="402" class="body" text-anchor="middle">and can omit, fabricate, or reorder candidates.</text>

    <path d="M300 426V461H455V479" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M900 426V461H745V479" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <rect x="190" y="487" width="820" height="86" fill="#382819" stroke="#ffb887" stroke-width="2"/>
    <text x="600" y="520" class="card-title" text-anchor="middle">Untrusted candidate peer / document-path claims</text>
    <text x="600" y="548" class="body" text-anchor="middle">Signatures attribute the claimant; they do not make a claim true or complete.</text>
    <path d="M600 573V605" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="190" y="613" width="820" height="92" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="600" y="647" class="card-title" text-anchor="middle">Normal secure document load</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(600 675) scale(0.92784 1)">Apply configured quorum/CID gates, authorization, signatures, decryption, and history validation.</text>
    <text x="600" y="697" class="body" text-anchor="middle">A collection search key never grants document read access.</text>
    <path d="M600 705V737" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="190" y="745" width="820" height="74" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="600" y="777" class="card-title" text-anchor="middle">Complete predicate recheck on authorized local state</text>
    <text x="600" y="802" class="body" text-anchor="middle">Only this local evaluation can admit the loaded document to the result page.</text>
    <path d="M600 819V851" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="190" y="859" width="820" height="70" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="600" y="890" class="card-title" text-anchor="middle">Deterministic bounded page merge</text>
    <text x="600" y="915" class="body" text-anchor="middle">No global completeness or exact-count guarantee in an open Byzantine network.</text>

    <rect x="50" y="957" width="1100" height="66" fill="#382237" stroke="#f0a5cf" stroke-width="2"/>
    <text x="600" y="984" class="eyebrow" text-anchor="middle" fill="#f0a5cf">EVIDENCE BOUNDARY</text>
    <text x="600" y="1008" class="body-strong" text-anchor="middle">These are composable protocol and manager primitives—not a shipped turnkey end-to-end distributed search workflow.</text>
  </g>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

    <text x="76" y="544" class="eyebrow" fill="#b7a1ff">PATH SEMANTICS</text>
    <text x="0" y="0" class="body-strong" transform="translate(245 544) scale(0.91461 1)">The relay forwards encrypted Peerborne traffic and does not need document plaintext or signing private keys.</text>
    <text x="0" y="0" class="body" transform="translate(76 576) scale(0.93298 1)">If ICE establishes a direct WebRTC connection, libp2p can remove the relay from the data path; that upgrade is not guaranteed.</text>

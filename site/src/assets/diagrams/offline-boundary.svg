  <text x="56" y="98" fill="#a7a0b6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="19">The replica must be open with its local key and state before the edit.</text>

  <line x1="120" y1="195" x2="1080" y2="195" stroke="#40394f" stroke-width="5"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <rect x="121" y="176" width="38" height="38" fill="#a3efb8"/>
    <text x="140" y="201" text-anchor="middle" fill="#1b382a" font-size="17" font-weight="800">1</text>
    <rect x="423" y="176" width="38" height="38" fill="#a3efb8"/>
    <text x="442" y="201" text-anchor="middle" fill="#1b382a" font-size="17" font-weight="800">2</text>
    <rect x="725" y="176" width="38" height="38" fill="#ffb887"/>
    <text x="744" y="201" text-anchor="middle" fill="#382819" font-size="17" font-weight="800">3</text>
    <rect x="1027" y="176" width="38" height="38" fill="#b7a1ff"/>
    <text x="1046" y="201" text-anchor="middle" fill="#30234c" font-size="17" font-weight="800">4</text>
  </g>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" filter="url(#shadow)">
    <rect x="55" y="248" width="258" height="160" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="83" y="285" fill="#a3efb8" font-size="16" font-weight="700">LOCAL · PRECONDITION</text>
    <text x="83" y="323" fill="#f5f0e8" font-size="23" font-weight="700">Replica is open</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(83 355) scale(0.95365 1)">Document state and key</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(83 381) scale(0.74930 1)">are available on this device</text>

    <rect x="357" y="248" width="258" height="160" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="385" y="285" fill="#a3efb8" font-size="16" font-weight="700">OFFLINE · LOCAL PATH</text>
    <text x="0" y="0" fill="#f5f0e8" font-size="23" font-weight="700" transform="translate(385 323) scale(0.96920 1)">Edit immediately</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(385 355) scale(0.87418 1)">Apply the CRDT mutation;</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(385 381) scale(0.74930 1)">encrypt and store the change</text>

    <rect x="659" y="248" width="258" height="160" fill="#382819" stroke="#ffb887" stroke-width="2"/>
    <text x="0" y="0" fill="#ffd5b5" font-size="16" font-weight="700" transform="translate(687 285) scale(0.96920 1)">RECONNECT · BEST EFFORT</text>
    <text x="0" y="0" fill="#f5f0e8" font-size="22" font-weight="700" transform="translate(687 323) scale(0.85327 1)">Restore a peer path</text>
    <text x="687" y="355" fill="#cbc5d6" font-size="17">libp2p may redial</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(687 381) scale(0.91219 1)">no durable replay queue</text>

    <rect x="961" y="248" width="184" height="160" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="989" y="285" fill="#b7a1ff" font-size="16" font-weight="700">IF DELIVERED</text>
    <text x="0" y="0" fill="#f5f0e8" font-size="23" font-weight="700" transform="translate(989 323) scale(0.84541 1)">Peer applies</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(989 350) scale(0.98039 1)">after envelope</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(989 374) scale(0.80738 1)">checks and needed</text>
    <text x="0" y="0" fill="#cbc5d6" font-size="17" transform="translate(989 398) scale(0.91503 1)">fetch + decrypt</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M313 328 H357" stroke="#a3efb8" marker-end="url(#arrow-teal)"/>
    <path d="M615 328 H659" stroke="#ffb887" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
    <path d="M917 328 H961" stroke="#b7a1ff" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  </g>

  <rect x="55" y="464" width="1090" height="104" fill="#242136" stroke="#756c89" stroke-width="2"/>
  <text x="83" y="503" fill="#f5f0e8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700">What the local write promise does not mean</text>
  <text x="83" y="535" fill="#cbc5d6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17">It does not confirm that any remote peer received, verified, or applied the update.</text>
  <text x="83" y="558" fill="#cbc5d6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17">A failed storage or publication step may also leave the local CRDT mutation visible.</text>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <rect x="55" y="605" width="357" height="60" fill="#1b382a" stroke="#a3efb8"/>
    <text x="0" y="0" text-anchor="middle" fill="#c7f5d3" font-size="16" font-weight="700" transform="translate(234 642) scale(0.92415 1)">Open-replica local editing: implemented</text>
    <rect x="429" y="605" width="337" height="60" fill="#382819" stroke="#ffb887"/>
    <text x="598" y="632" text-anchor="middle" fill="#ffd5b5" font-size="17" font-weight="700">Offline → reconnect → deliver</text>
    <text x="598" y="652" text-anchor="middle" fill="#ffd5b5" font-size="14">not verified end to end</text>
    <rect x="783" y="605" width="362" height="60" fill="#30234c" stroke="#b7a1ff"/>
    <text x="964" y="642" text-anchor="middle" fill="#d6c8ff" font-size="17" font-weight="700">Remote delivery: best effort</text>
  </g>

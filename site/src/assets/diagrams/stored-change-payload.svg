<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="stored-payload-title stored-payload-description">
  <title id="stored-payload-title">CID-addressed stored change payload</title>
  <desc id="stored-payload-description">A stored Helia byte frame contains a document-key ID, mode-specific encryption parameters such as a nonce, IV, or counter, and encrypted serialized CRDT change bytes. The CID is shown outside the frame as its content address. Parent links, shadow-tree topology, a separate writer signature, and a per-block ACL decision are not stored in the payload.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="stored-payload-title stored-payload-description">
  <title id="stored-payload-title">CID-addressed stored change payload</title>
  <desc id="stored-payload-description">A stored Helia byte frame contains a document-key ID, mode-specific encryption parameters such as a nonce, IV, or counter, and encrypted serialized CRDT change bytes. The CID is shown outside the frame as its content address. Parent links, shadow-tree topology, a separate writer signature, and a per-block ACL decision are not stored in the payload.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c7d2fe" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#818cf8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 760; }
      .subtitle { fill: #94a3b8; font-size: 17px; }
      .eyebrow { font-size: 15px; font-weight: 760; letter-spacing: 1.25px; }
      .section { fill: #e2e8f0; font-size: 16px; font-weight: 740; letter-spacing: .5px; }
      .card-title { fill: #f8fafc; font-size: 19px; font-weight: 740; }
      .body { fill: #cbd5e1; font-size: 15px; }
      .body-strong { fill: #e2e8f0; font-size: 15px; font-weight: 700; }
      .badge { font-size: 15px; font-weight: 760; letter-spacing: .35px; }
      .node { fill: #f8fafc; font-size: 18px; font-weight: 760; }
      .node-detail { fill: #cbd5e1; font-size: 15px; }
      .number { fill: #0f172a; font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="745" rx="28" fill="url(#background)"/>
  <rect width="1200" height="745" rx="28" fill="url(#grid)"/>
  <path d="M0 28A28 28 0 0 1 28 0H1172A28 28 0 0 1 1200 28V34H0Z" fill="#2dd4bf"/>
  <g>
    <text x="50" y="69" class="title">CID-addressed stored change payload</text>
    <text x="50" y="99" class="subtitle">The CID addresses the complete encrypted byte frame; it is not a field inside that frame.</text>

    <text x="50" y="148" class="eyebrow" fill="#a5b4fc">OPAQUE BYTES STORED IN HELIA</text>
    <g filter="url(#shadow)">
      <rect x="70" y="174" width="720" height="372" rx="24" fill="#151d35" stroke="#818cf8" stroke-width="2.5"/>
    </g>
    <text x="100" y="211" class="card-title">Complete stored byte frame</text>
    <line x1="100" y1="230" x2="760" y2="230" stroke="#475569"/>

    <rect x="100" y="254" width="660" height="63" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="126" y="292" class="body-strong">document-key ID</text>
    <text x="620" y="292" class="body" text-anchor="end">framing field</text>
    <rect x="100" y="334" width="660" height="74" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="126" y="365" class="body-strong">mode-specific encryption parameters</text>
    <text x="126" y="390" class="body">nonce / IV / counter, according to the configured provider</text>
    <rect x="100" y="425" width="660" height="91" rx="18" fill="#123038" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="126" y="458" class="body-strong">encrypted change bytes</text>
    <text x="126" y="486" class="body">ciphertext of the serialized CRDT change</text>

    <path d="M790 360H854" fill="none" stroke="#2dd4bf" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <rect x="862" y="276" width="288" height="168" rx="24" fill="#0f2b2e" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="1006" y="316" class="card-title" text-anchor="middle" fill="#99f6e4">CID</text>
    <text x="1006" y="347" class="body" text-anchor="middle">content address of the</text>
    <text x="1006" y="371" class="body" text-anchor="middle">complete byte frame</text>
    <rect x="894" y="390" width="224" height="34" rx="17" fill="#123a3d" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="1006" y="413" class="badge" text-anchor="middle" fill="#99f6e4">OUTSIDE THE FRAME</text>

    <rect x="50" y="582" width="1100" height="86" rx="18" fill="#301f2c" stroke="#f472b6" stroke-width="2"/>
    <text x="76" y="615" class="eyebrow" fill="#f9a8d4">NOT STORED IN THIS FRAME</text>
    <text x="76" y="646" class="body-strong">parent links · shadow-tree topology · separate writer signature · per-block ACL decision</text>

    <text x="600" y="709" class="body" text-anchor="middle">Helia validates fetched ciphertext against the requested CID before Peerborne decrypts and deserializes it.</text>
  </g>
</svg>

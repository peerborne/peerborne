<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785" viewBox="0 0 1200 785" role="img" aria-labelledby="shadow-sync-graph-title shadow-sync-graph-description">
  <title id="shadow-sync-graph-title">Shadow sync graph</title>
  <desc id="shadow-sync-graph-description">A CRDT sync message contains inline root C. C has two sibling child-map entries: inline prior change B and deferred concurrent cross-link B prime. B has inline ancestor A. The CRDT layer merges B and B prime when both arrive. Separate Helia blocks are addressed by CIDs and contain encrypted changes but no graph links, separate writer signatures, or per-block ACL decisions.</desc>
  <defs>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6c8ff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0c0b13" flood-opacity="1"/></filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#b7a1ff"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#a3efb8"/>
    </marker>

    <text x="50" y="99" class="subtitle">Graph edges travel in the encrypted wire message, while stored change payloads remain link-free.</text>

    <text x="50" y="145" class="eyebrow" fill="#a3efb8">ENCRYPTED CRDTSyncMessage SHADOW TREE</text>
    <g filter="url(#shadow)">
      <rect x="270" y="174" width="242" height="94" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <text x="391" y="212" class="node" text-anchor="middle">CID C</text>
    <text x="391" y="241" class="node-detail" text-anchor="middle">root · inline change</text>
    <g filter="url(#shadow)">
      <rect x="95" y="346" width="242" height="94" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <text x="216" y="384" class="node" text-anchor="middle">CID B</text>
    <text x="216" y="413" class="node-detail" text-anchor="middle">inline prior change</text>
    <g filter="url(#shadow)">
      <rect x="445" y="346" width="242" height="94" fill="#30234c" stroke="#b7a1ff" stroke-width="2" stroke-dasharray="8 6"/>
    </g>
    <text x="566" y="384" class="node" text-anchor="middle">CID B′</text>
    <text x="0" y="0" class="node-detail" text-anchor="middle" transform="translate(566 413) scale(0.85926 1)">deferred concurrent cross-link</text>
    <g filter="url(#shadow)">
      <rect x="95" y="518" width="242" height="94" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <text x="216" y="556" class="node" text-anchor="middle">CID A</text>
    <text x="216" y="585" class="node-detail" text-anchor="middle">inline ancestor</text>

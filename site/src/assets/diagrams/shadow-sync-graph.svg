    <path d="M391 268V301H566V338" fill="none" stroke="#b7a1ff" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowIndigo)"/>
    <path d="M216 440V510" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <rect x="197" y="289" width="388" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="391" y="312" class="badge" text-anchor="middle" fill="#c7f5d3">B AND B′ ARE SIBLINGS UNDER C</text>

    <rect x="735" y="145" width="415" height="516" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="761" y="180" class="eyebrow" fill="#b7a1ff">SEPARATE HELIA BLOCKS</text>
    <text x="0" y="0" class="body" transform="translate(761 212) scale(0.98677 1)">Each CID addresses encrypted change bytes.</text>
    <rect x="761" y="240" width="165" height="70" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="843.5" y="271" class="card-title" text-anchor="middle">block C</text>
    <text x="843.5" y="294" class="body" text-anchor="middle">encrypted change</text>
    <rect x="959" y="240" width="165" height="70" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="1041.5" y="271" class="card-title" text-anchor="middle">block B</text>
    <text x="1041.5" y="294" class="body" text-anchor="middle">encrypted change</text>
    <rect x="761" y="331" width="165" height="70" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="843.5" y="362" class="card-title" text-anchor="middle">block B′</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(843.5 385) scale(0.95679 1)">fetched if missing</text>
    <rect x="959" y="331" width="165" height="70" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="1041.5" y="362" class="card-title" text-anchor="middle">block A</text>
    <text x="1041.5" y="385" class="body" text-anchor="middle">encrypted change</text>
    <line x1="761" y1="434" x2="1124" y2="434" stroke="#40394f"/>
    <text x="761" y="469" class="body-strong">Stored payloads do not contain:</text>
    <text x="781" y="500" class="body">• parent or cross-link edges</text>
<text x="781" y="528" class="body">• a separate writer signature</text>
<text x="781" y="556" class="body">• a per-block ACL decision</text>
    <rect x="761" y="594" width="363" height="34" fill="#30234c" stroke="#b7a1ff" stroke-width="1.5"/>
    <text x="942.5" y="617" class="badge" text-anchor="middle" fill="#d6c8ff">GRAPH LIVES IN THE WIRE MESSAGE</text>

    <rect x="50" y="684" width="1100" height="67" fill="#242136" stroke="#40394f" stroke-width="1.5"/>
    <text x="0" y="0" class="body-strong" transform="translate(74 712) scale(0.88889 1)">Merge semantics:</text>
    <text x="212" y="712" class="body">the CRDT layer merges B and B′ when both payloads arrive; the shadow graph guides discovery.</text>
    <text x="74" y="736" class="body">Inline nodes can be applied immediately; an omitted payload is fetched by its CID only when needed.</text>
  </g>

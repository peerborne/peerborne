    <text x="76" y="696" class="eyebrow" fill="#f0a5cf">BOUNDARY, NOT AN INLINE CHANGE LINK</text>
    <text x="0" y="0" class="body-strong" transform="translate(76 728) scale(0.97153 1)">The snapshot carries change 500’s CID as metadata; the snapshot itself is not linked into the sync tree as a change node.</text>
    <text x="76" y="751" class="body">Pruning the in-memory tree does not delete old Helia blocks unless optional post-prune garbage collection is enabled.</text>

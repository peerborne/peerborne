    <text x="50" y="345" class="eyebrow" fill="#a3efb8">2 · SEPARATE SYNC ENVELOPE</text>
    <rect x="50" y="368" width="250" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="175" y="405" class="card-title" text-anchor="middle">CRDTSyncMessage</text>
    <text x="175" y="434" class="body" text-anchor="middle">Names the CID</text>
<text x="0" y="0" class="body" text-anchor="middle" transform="translate(175 458) scale(0.91954 1)">May also carry inline history</text>
    <rect x="350" y="368" width="250" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="475" y="405" class="card-title" text-anchor="middle">Sign when enabled</text>
    <text x="475" y="434" class="body" text-anchor="middle">P-384 signature covers</text>
<text x="475" y="458" class="body" text-anchor="middle">the wire message</text>
    <rect x="650" y="368" width="250" height="112" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="775" y="405" class="card-title" text-anchor="middle">Serialize + encrypt</text>
    <text x="775" y="434" class="body" text-anchor="middle">Document-key encryption</text>
<text x="775" y="458" class="body" text-anchor="middle">protects the full envelope</text>
    <rect x="950" y="368" width="200" height="112" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="1050" y="405" class="card-title" text-anchor="middle" fill="#c7f5d3">Publish</text>
    <text x="1050" y="434" class="body" text-anchor="middle">Encrypted envelope</text>
<text x="1050" y="458" class="body" text-anchor="middle">on GossipSub</text>
    <path d="M300 424H342" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M600 424H642" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M900 424H942" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <text x="50" y="543" class="eyebrow" fill="#ffb887">3 · RECEIVER PROCESSING</text>
    <rect x="50" y="566" width="235" height="118" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="167.5" y="605" class="card-title" text-anchor="middle">Encrypted envelope</text>
    <text x="167.5" y="636" class="body" text-anchor="middle">received from GossipSub</text>
    <rect x="325" y="566" width="235" height="118" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="0" y="0" class="card-title" text-anchor="middle" transform="translate(442.5 604) scale(0.93985 1)">Decrypt + deserialize</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(442.5 635) scale(0.92593 1)">Open the document-key frame</text>
<text x="442.5" y="659" class="body" text-anchor="middle">and recover the message</text>
    <rect x="600" y="566" width="235" height="118" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="0" y="0" class="card-title" text-anchor="middle" transform="translate(717.5 604) scale(0.98684 1)">Verify when required</text>
    <text x="717.5" y="635" class="body" text-anchor="middle">Check a current writer</text>
<text x="717.5" y="659" class="body" text-anchor="middle">when signing is enabled</text>
    <rect x="875" y="566" width="275" height="118" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="0" y="0" class="card-title" text-anchor="middle" transform="translate(1012.5 604) scale(0.96857 1)">Apply inline / fetch CID</text>
    <text x="1012.5" y="635" class="body" text-anchor="middle">Inline changes can apply now;</text>
<text x="1012.5" y="659" class="body" text-anchor="middle">missing payloads use Helia</text>
    <path d="M285 625H317" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M560 625H592" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M835 625H867" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <path d="M1012 684V736H265V758" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <rect x="100" y="766" width="330" height="112" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="265" y="804" class="card-title" text-anchor="middle">Validate requested CID</text>
    <text x="265" y="835" class="body" text-anchor="middle">Helia checks fetched bytes</text>
<text x="265" y="859" class="body" text-anchor="middle">against the content address</text>
    <rect x="485" y="766" width="330" height="112" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="650" y="804" class="card-title" text-anchor="middle">Decrypt + deserialize block</text>
    <text x="650" y="835" class="body" text-anchor="middle">Use the document key;</text>
<text x="650" y="859" class="body" text-anchor="middle">no separate block signature exists</text>
    <rect x="870" y="766" width="280" height="112" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="1010" y="804" class="card-title" text-anchor="middle" fill="#c7f5d3">Apply CRDT change</text>
    <text x="1010" y="835" class="body" text-anchor="middle">Merge the validated,</text>
<text x="1010" y="859" class="body" text-anchor="middle">decrypted provider delta</text>
    <path d="M430 822H477" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M815 822H862" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="50" y="908" width="1100" height="102" fill="#382237" stroke="#f0a5cf" stroke-width="2"/>
    <text x="76" y="940" class="eyebrow" fill="#f0a5cf">SIGNING BOUNDARY</text>
    <text x="76" y="968" class="body-strong">The stored CID-addressed block remains unsigned; the wire-message signature is separate and conditional.</text>
    <text x="76" y="994" class="body">Disabling ordinary signing leaves encryption in place but removes this writer-authentication gate for ordinary sync.</text>
  </g>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

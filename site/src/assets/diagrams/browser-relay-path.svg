<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Peerborne browser-to-browser initial document load through Circuit Relay</title>
  <desc id="description">Two NAT-isolated Chromium peers exchange an encrypted initial document load through Circuit Relay. The test obtains peer A's circuit address and has peer B dial that relayed address explicitly. An optional direct WebRTC or DCUtR path is shown as not verified in CI. The test uses the same identity on both devices and restores the document key out of band. The relay sees metadata, not document plaintext, and the topology has no database service.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Peerborne browser-to-browser initial document load through Circuit Relay</title>
  <desc id="description">Two NAT-isolated Chromium peers exchange an encrypted initial document load through Circuit Relay. The test obtains peer A's circuit address and has peer B dial that relayed address explicitly. An optional direct WebRTC or DCUtR path is shown as not verified in CI. The test uses the same identity on both devices and restores the document key out of band. The relay sees metadata, not document plaintext, and the topology has no database service.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080d1a" />
      <stop offset="0.52" stop-color="#10172a" />
      <stop offset="1" stop-color="#111b31" />
    </linearGradient>
    <linearGradient id="relayCard" x1="470" y1="248" x2="730" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#16213b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c7d2fe" stroke-opacity="0.045" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.48" />
    </filter>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf" />
    </marker>
    <marker id="indigoArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#818cf8" />
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#background)" />
  <rect width="1200" height="720" fill="url(#grid)" />
  <circle cx="600" cy="365" r="310" fill="#4f46e5" opacity="0.055" />
  <circle cx="138" cy="610" r="230" fill="#14b8a6" opacity="0.035" />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="55" fill="#f8fafc" font-size="30" font-weight="750">Browser relay path</text>
    <text x="60" y="86" fill="#94a3b8" font-size="18">Narrow, CI-backed initial document load — not a live-sync claim</text>
    <rect x="953" y="34" width="187" height="42" rx="21" fill="#172554" stroke="#6366f1" />
    <text x="1046.5" y="61" fill="#c7d2fe" font-size="16" font-weight="700" text-anchor="middle">EVIDENCE SCOPED</text>

    <rect x="370" y="122" width="460" height="62" rx="31" fill="#0f2b2e" stroke="#2dd4bf" stroke-opacity="0.58" />
    <text x="600" y="148" fill="#5eead4" font-size="13" font-weight="750" letter-spacing="1.3" text-anchor="middle">TEST ORCHESTRATION</text>
    <text x="600" y="171" fill="#cbd5e1" font-size="15" font-weight="600" text-anchor="middle">B explicitly dials A’s obtained /p2p-circuit/ address</text>

    <rect x="35" y="205" width="350" height="315" rx="30" fill="#0f1b2e" fill-opacity="0.82" stroke="#334155" stroke-width="2" stroke-dasharray="7 8" />
    <rect x="815" y="205" width="350" height="315" rx="30" fill="#0f1b2e" fill-opacity="0.82" stroke="#334155" stroke-width="2" stroke-dasharray="7 8" />
    <rect x="56" y="222" width="104" height="33" rx="16.5" fill="#132e35" stroke="#2dd4bf" stroke-opacity="0.55" />
    <text x="108" y="244" fill="#99f6e4" font-size="14" font-weight="700" text-anchor="middle">NAT A</text>
    <rect x="836" y="222" width="104" height="33" rx="16.5" fill="#132e35" stroke="#2dd4bf" stroke-opacity="0.55" />
    <text x="888" y="244" fill="#99f6e4" font-size="14" font-weight="700" text-anchor="middle">NAT B</text>

    <g filter="url(#shadow)">
      <rect x="65" y="270" width="290" height="218" rx="24" fill="#142033" stroke="#2dd4bf" stroke-width="2" />
      <rect x="845" y="270" width="290" height="218" rx="24" fill="#142033" stroke="#2dd4bf" stroke-width="2" />
    </g>

    <g transform="translate(91 298)">
      <rect width="58" height="44" rx="7" fill="#0b1220" stroke="#5eead4" stroke-width="2" />
      <path d="M6 35H52" stroke="#5eead4" stroke-width="2" />
      <path d="M21 51H37M29 44V51" stroke="#5eead4" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="169" y="315" fill="#f0fdfa" font-size="22" font-weight="740">Browser peer A</text>
    <text x="169" y="341" fill="#99f6e4" font-size="15">Chromium process</text>
    <line x1="91" y1="369" x2="329" y2="369" stroke="#334155" />
    <circle cx="103" cy="401" r="8" fill="#2dd4bf" />
    <text x="123" y="407" fill="#cbd5e1" font-size="16">Creates encrypted document</text>
    <circle cx="103" cy="438" r="8" fill="#2dd4bf" />
    <text x="123" y="444" fill="#cbd5e1" font-size="16">Serves existing history</text>
    <rect x="91" y="460" width="213" height="28" rx="14" fill="#0f2b2e" />
    <text x="197.5" y="479" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">LOCAL-FIRST DOCUMENT</text>

    <g transform="translate(871 298)">
      <rect width="58" height="44" rx="7" fill="#0b1220" stroke="#5eead4" stroke-width="2" />
      <path d="M6 35H52" stroke="#5eead4" stroke-width="2" />
      <path d="M21 51H37M29 44V51" stroke="#5eead4" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="949" y="315" fill="#f0fdfa" font-size="22" font-weight="740">Browser peer B</text>
    <text x="949" y="341" fill="#99f6e4" font-size="15">Separate Chromium process</text>
    <line x1="871" y1="369" x2="1109" y2="369" stroke="#334155" />
    <circle cx="883" cy="401" r="8" fill="#2dd4bf" />
    <text x="903" y="407" fill="#cbd5e1" font-size="16">Dials A via the relay circuit</text>
    <circle cx="883" cy="438" r="8" fill="#2dd4bf" />
    <text x="903" y="444" fill="#cbd5e1" font-size="16">Loads and decrypts history</text>
    <rect x="871" y="460" width="225" height="28" rx="14" fill="#0f2b2e" />
    <text x="983.5" y="479" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">INITIAL LOAD VERIFIED</text>

    <g filter="url(#shadow)">
      <rect x="465" y="255" width="270" height="222" rx="28" fill="url(#relayCard)" stroke="#818cf8" stroke-width="2.5" />
    </g>
    <g transform="translate(558 282)">
      <path d="M42 0L77 20V60L42 80L7 60V20Z" fill="#312e81" stroke="#a5b4fc" stroke-width="2" />
      <circle cx="42" cy="40" r="12" fill="#818cf8" />
      <circle cx="42" cy="40" r="4" fill="#eef2ff" />
      <path d="M42 28V11M52 34L68 25M52 47L68 56M32 47L16 56M32 34L16 25" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="600" y="390" fill="#eef2ff" font-size="24" font-weight="760" text-anchor="middle">Circuit Relay v2</text>
    <text x="600" y="418" fill="#c7d2fe" font-size="15" text-anchor="middle">Forwards encrypted document traffic</text>
    <text x="600" y="442" fill="#94a3b8" font-size="14" text-anchor="middle">Sees peer IDs, timing, and volume</text>
    <text x="600" y="464" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle">NOT DOCUMENT PLAINTEXT</text>

    <path d="M355 352H459" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" marker-end="url(#tealArrow)" />
    <path d="M741 352H845" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" marker-end="url(#tealArrow)" />
    <rect x="377" y="311" width="446" height="31" rx="15.5" fill="#0b2529" stroke="#2dd4bf" stroke-opacity="0.48" />
    <text x="600" y="332" fill="#99f6e4" font-size="14" font-weight="700" text-anchor="middle">CI-BACKED ENCRYPTED INITIAL DOCUMENT LOAD</text>

    <rect x="421" y="500" width="358" height="63" rx="19" fill="#171b35" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="455" cy="531" r="12" fill="#312e81" stroke="#a5b4fc" />
    <path d="M451 531H470M465 531V538M461 531V536" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" />
    <text x="483" y="526" fill="#e0e7ff" font-size="15" font-weight="700">Same user identity on both devices</text>
    <text x="483" y="548" fill="#a5b4fc" font-size="14">Document key restored out of band</text>

    <path d="M338 493C454 624 746 624 862 493" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="12 11" marker-end="url(#indigoArrow)" opacity="0.88" />
    <rect x="393" y="581" width="414" height="38" rx="19" fill="#171b35" stroke="#6366f1" stroke-opacity="0.75" />
    <text x="600" y="606" fill="#c7d2fe" font-size="15" font-weight="700" text-anchor="middle">Optional direct WebRTC / DCUtR — not CI-verified</text>

    <rect x="65" y="646" width="1070" height="44" rx="22" fill="#111d2e" stroke="#334155" />
    <circle cx="91" cy="668" r="7" fill="#2dd4bf" />
    <text x="110" y="674" fill="#cbd5e1" font-size="16">Test topology: relay + app servers + two browser peers</text>
    <rect x="792" y="655" width="318" height="27" rx="13.5" fill="#0f2b2e" />
    <text x="951" y="674" fill="#5eead4" font-size="14" font-weight="750" text-anchor="middle">NO APPLICATION DATABASE SERVICE</text>
  </g>
</svg>

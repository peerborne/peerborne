    <text x="60" y="98" fill="#a7a0b6" font-size="19">The collaboration goal is similar. The trust boundary is not.</text>

    <rect x="50" y="128" width="520" height="466" fill="#171521" fill-opacity="0.86" stroke="#756c89" />
    <rect x="630" y="128" width="520" height="466" fill="#30234c" stroke="#b7a1ff" stroke-opacity="0.82" />

    <rect x="74" y="161" width="16" height="16" fill="#a7a0b6"/>
    <text x="102" y="178" fill="#cbc5d6" font-size="25" font-weight="700">Centralized application</text>
    <text x="80" y="211" fill="#a7a0b6" font-size="17">One custodian sits on the document path</text>

    <rect x="654" y="161" width="16" height="16" fill="#a3efb8"/>
    <text x="682" y="178" fill="#f5f0e8" font-size="25" font-weight="700">Peerborne</text>
    <text x="660" y="211" fill="#c7f5d3" font-size="17">Plaintext stays at authorized endpoints</text>

    <rect x="82" y="248" width="184" height="82" fill="#242136" stroke="#756c89" />
    <text x="174" y="280" fill="#f5f0e8" font-size="19" font-weight="700" text-anchor="middle">Participant A</text>
    <text x="174" y="307" fill="#cbc5d6" font-size="16" text-anchor="middle">reads and writes</text>

    <rect x="354" y="248" width="184" height="82" fill="#242136" stroke="#756c89" />
    <text x="446" y="280" fill="#f5f0e8" font-size="19" font-weight="700" text-anchor="middle">Participant B</text>
    <text x="446" y="307" fill="#cbc5d6" font-size="16" text-anchor="middle">reads and writes</text>

    <path d="M174 338V386" fill="none" stroke="#a7a0b6" stroke-width="3" marker-start="url(#arrowSlate)" marker-end="url(#arrowSlate)" />
    <path d="M446 338V386" fill="none" stroke="#a7a0b6" stroke-width="3" marker-start="url(#arrowSlate)" marker-end="url(#arrowSlate)" />
    <text x="310" y="365" fill="#cbc5d6" font-size="16" text-anchor="middle">plaintext reads and writes</text>

    <rect x="130" y="395" width="360" height="116" fill="#382237" stroke="#f0a5cf" stroke-opacity="0.72" />
    <text x="0" y="0" fill="#f0a5cf" font-size="21" font-weight="700" text-anchor="middle" transform="translate(310 431) scale(0.95785 1)">Application server + database</text>
    <text x="310" y="463" fill="#f5f0e8" font-size="18" text-anchor="middle">stores document plaintext</text>
    <text x="310" y="490" fill="#cbc5d6" font-size="15" text-anchor="middle">trusted for content and availability</text>

    <rect x="80" y="535" width="460" height="38" fill="#242136" />
    <text x="0" y="0" fill="#cbc5d6" font-size="15" text-anchor="middle" transform="translate(310 560) scale(0.94340 1)">Central service can read and govern access to content</text>

    <rect x="662" y="247" width="205" height="96" fill="#30234c" stroke="#b7a1ff" />
    <text x="0" y="0" fill="#f5f0e8" font-size="19" font-weight="700" text-anchor="middle" transform="translate(764.5 279) scale(0.90028 1)">Authorized device A</text>
    <text x="0" y="0" fill="#d6c8ff" font-size="16" text-anchor="middle" transform="translate(764.5 307) scale(0.92330 1)">plaintext + local keys</text>
    <text x="764.5" y="329" fill="#a7a0b6" font-size="13" text-anchor="middle">local CRDT replica</text>

    <rect x="913" y="247" width="205" height="96" fill="#1b382a" stroke="#a3efb8" />
    <text x="0" y="0" fill="#f5f0e8" font-size="19" font-weight="700" text-anchor="middle" transform="translate(1015.5 279) scale(0.90028 1)">Authorized device B</text>
    <text x="0" y="0" fill="#c7f5d3" font-size="16" text-anchor="middle" transform="translate(1015.5 307) scale(0.92330 1)">plaintext + local keys</text>
    <text x="1015.5" y="329" fill="#a7a0b6" font-size="13" text-anchor="middle">local CRDT replica</text>

    <path d="M765 352C765 374 813 382 835 395" fill="none" stroke="#a3efb8" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)" />
    <path d="M1016 352C1016 374 968 382 946 395" fill="none" stroke="#a3efb8" stroke-width="3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)" />
    <rect x="706" y="401" width="388" height="125" fill="#242136" stroke="#b7a1ff" />
    <text x="900" y="427" fill="#d6c8ff" font-size="19" font-weight="700" text-anchor="middle">Relay / network infrastructure</text>
    <text x="900" y="451" fill="#c7f5d3" font-size="15" text-anchor="middle">forwards bidirectional encrypted traffic</text>
    <text x="900" y="475" fill="#d6c8ff" font-size="14" text-anchor="middle">Sync envelope: signed if enabled + encrypted</text>
    <text x="0" y="0" fill="#d6c8ff" font-size="14" text-anchor="middle" transform="translate(900 498) scale(0.95745 1)">Fetched change block: encrypted + CID-addressed</text>
    <text x="900" y="518" fill="#cbc5d6" font-size="13" text-anchor="middle">sees peer IDs, topics, timing, and volume</text>

    <rect x="660" y="535" width="458" height="38" fill="#1b382a" stroke="#a3efb8" stroke-opacity="0.45" />
    <text x="889" y="560" fill="#c7f5d3" font-size="15" text-anchor="middle">Cannot read document plaintext without its key</text>

    <rect x="50" y="620" width="1100" height="64" fill="#171521" stroke="#756c89" />
    <rect x="75" y="645" width="14" height="14" fill="#b7a1ff"/>
    <text x="102" y="646" fill="#cbc5d6" font-size="17" font-weight="700">Application responsibility</text>
    <text x="102" y="670" fill="#a7a0b6" font-size="15">Identity, key backup, and recovery remain app-owned.</text>
    <rect x="634" y="645" width="14" height="14" fill="#a3efb8"/>
    <text x="661" y="646" fill="#cbc5d6" font-size="17" font-weight="700">Availability still matters</text>
    <text x="0" y="0" fill="#a7a0b6" font-size="15" transform="translate(661 670) scale(0.82118 1)">Peers and infrastructure may be unavailable or disrupt delivery.</text>
  </g>

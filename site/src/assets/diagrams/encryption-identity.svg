<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="encryption-identity-title encryption-identity-description">
  <title id="encryption-identity-title">Encryption and identity roles</title>
  <desc id="encryption-identity-description">Diagram separating an application-supplied ECDSA P-384 writer signing key, an application-supplied ECDH P-256 onboarding KEM key, and the libp2p Peer ID transport identity. Peerborne does not map signing keys to Peer IDs. Document state includes encryption keys and an ACL bound to signing public keys. Each change produces a CID-addressed encrypted stored payload without a block signature and a separate signed-when-enabled encrypted GossipSub message.</desc>
  <defs>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6c8ff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0c0b13" flood-opacity="1"/></filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#b7a1ff"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#a3efb8"/>
    </marker>

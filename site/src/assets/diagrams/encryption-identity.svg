      .eyebrow { font-size: 15px; font-weight: 760; letter-spacing: 1.25px; }
      .section { fill: #cbc5d6; font-size: 16px; font-weight: 740; letter-spacing: .5px; }
      .card-title { fill: #f5f0e8; font-size: 19px; font-weight: 740; }
      .body { fill: #cbc5d6; font-size: 15px; }
      .body-strong { fill: #cbc5d6; font-size: 15px; font-weight: 700; }
      .badge { font-size: 15px; font-weight: 760; letter-spacing: .35px; }
      .node { fill: #f5f0e8; font-size: 18px; font-weight: 760; }
      .node-detail { fill: #cbc5d6; font-size: 15px; }
      .number { fill: #171521; font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#171521"/>
  <rect width="1200" height="900" fill="url(#grid)"/>


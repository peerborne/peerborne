<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="encryption-identity-title encryption-identity-description">
  <title id="encryption-identity-title">Encryption and identity roles</title>
  <desc id="encryption-identity-description">Diagram separating an application-supplied ECDSA P-384 writer signing key, an application-supplied ECDH P-256 onboarding KEM key, and the libp2p Peer ID transport identity. Peerborne does not map signing keys to Peer IDs. Document state includes encryption keys and an ACL bound to signing public keys. Each change produces a CID-addressed encrypted stored payload without a block signature and a separate signed-when-enabled encrypted GossipSub message.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c7d2fe" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#818cf8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 760; }
      .subtitle { fill: #94a3b8; font-size: 17px; }
      .eyebrow { font-size: 15px; font-weight: 760; letter-spacing: 1.25px; }
      .section { fill: #e2e8f0; font-size: 16px; font-weight: 740; letter-spacing: .5px; }
      .card-title { fill: #f8fafc; font-size: 19px; font-weight: 740; }
      .body { fill: #cbd5e1; font-size: 15px; }
      .body-strong { fill: #e2e8f0; font-size: 15px; font-weight: 700; }
      .badge { font-size: 15px; font-weight: 760; letter-spacing: .35px; }
      .node { fill: #f8fafc; font-size: 18px; font-weight: 760; }
      .node-detail { fill: #cbd5e1; font-size: 15px; }
      .number { fill: #0f172a; font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="900" rx="28" fill="url(#background)"/>
  <rect width="1200" height="900" rx="28" fill="url(#grid)"/>
  <path d="M0 28A28 28 0 0 1 28 0H1172A28 28 0 0 1 1200 28V34H0Z" fill="#2dd4bf"/>
  <g>
    <text x="50" y="69" class="title">Encryption and identity roles</text>
    <text x="50" y="99" class="subtitle">Signing identity, KEM identity, and libp2p transport identity are separate concerns.</text>

    <text x="50" y="143" class="eyebrow" fill="#5eead4">THREE SEPARATE KEY OR IDENTITY ROLES</text>
    <rect x="50" y="163" width="340" height="138" rx="18" fill="#16213a" stroke="#6366f1" stroke-width="2"/>
    <text x="74" y="198" class="card-title">Writer signing identity</text>
    <text x="74" y="225" class="body-strong">ECDSA P-384 key pair</text>
    <text x="74" y="251" class="body">Application supplied and stored</text>
<text x="74" y="274" class="body">Authenticates signed document messages</text>
    <rect x="430" y="163" width="340" height="138" rx="18" fill="#123038" stroke="#14b8a6" stroke-width="2"/>
    <text x="454" y="198" class="card-title">Reader onboarding identity</text>
    <text x="454" y="225" class="body-strong">ECDH P-256 KEM key pair</text>
    <text x="454" y="251" class="body">Application supplied and stored</text>
<text x="454" y="274" class="body">Opens recipient-sealed Welcome data</text>
    <rect x="810" y="163" width="340" height="138" rx="18" fill="#302441" stroke="#8b5cf6" stroke-width="2"/>
    <text x="834" y="198" class="card-title">Transport identity</text>
    <text x="834" y="225" class="body-strong">libp2p Peer ID</text>
    <text x="834" y="251" class="body">Owned by the libp2p transport</text>
<text x="834" y="274" class="body">Separate from application signing keys</text>

    <rect x="50" y="329" width="1100" height="132" rx="18" fill="#111f34" stroke="#475569" stroke-width="2"/>
    <text x="74" y="363" class="eyebrow" fill="#93c5fd">DOCUMENT-SCOPED STATE</text>
    <text x="74" y="397" class="card-title">Document encryption keys</text>
    <text x="333" y="397" class="body">AES-GCM by default</text>
    <text x="590" y="397" class="card-title">Reader / writer ACL</text>
    <text x="806" y="397" class="body">Bound to signing public keys</text>
    <rect x="74" y="414" width="442" height="34" rx="17" fill="#301f2c" stroke="#f472b6" stroke-width="1.5"/>
    <text x="295" y="437" class="badge" text-anchor="middle" fill="#fbcfe8">NO SIGNING-KEY → PEER-ID MAP</text>
    <text x="540" y="438" class="body">Applications own enrollment, private-key persistence, backup, and recovery.</text>
    <path d="M220 301V321" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M600 301V321" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M980 301V321" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <text x="50" y="508" class="eyebrow" fill="#fbbf24">PER-CHANGE ARTIFACTS</text>
    <rect x="50" y="530" width="520" height="222" rx="18" fill="#1b2140" stroke="#6366f1" stroke-width="2"/>
    <text x="76" y="565" class="card-title">CID-addressed stored payload</text>
    <text x="76" y="595" class="body">Serialized CRDT change</text>
<text x="76" y="621" class="body">→ encrypted with the document key</text>
<text x="76" y="647" class="body">→ stored as opaque bytes in Helia</text>
<text x="76" y="673" class="body">→ CID addresses the complete byte frame</text>
    <rect x="76" y="696" width="412" height="34" rx="17" fill="#301f2c" stroke="#f472b6" stroke-width="1.5"/>
    <text x="282" y="719" class="badge" text-anchor="middle" fill="#fbcfe8">NO BLOCK SIGNATURE OR ACL DECISION</text>

    <rect x="630" y="530" width="520" height="222" rx="18" fill="#123038" stroke="#14b8a6" stroke-width="2"/>
    <text x="656" y="565" class="card-title">Separate GossipSub envelope</text>
    <text x="656" y="595" class="body">CRDTSyncMessage names the new CID</text>
<text x="656" y="621" class="body">→ signed with P-384 when signing is enabled</text>
<text x="656" y="647" class="body">→ serialized and encrypted with document key</text>
<text x="656" y="673" class="body">→ full encrypted envelope is published</text>
    <rect x="656" y="696" width="362" height="34" rx="17" fill="#0f3b3b" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="837" y="719" class="badge" text-anchor="middle" fill="#99f6e4">SIGNATURE COVERS WIRE MESSAGE</text>

    <rect x="50" y="781" width="1100" height="89" rx="18" fill="#111d2e" stroke="#475569" stroke-width="2"/>
    <text x="74" y="815" class="eyebrow" fill="#93c5fd">RECEIVER ORDER</text>
    <text x="240" y="815" class="body-strong">decrypt + deserialize envelope</text>
    <text x="475" y="815" class="body-strong">→</text>
    <text x="507" y="815" class="body-strong">verify known writer when applicable</text>
    <text x="787" y="815" class="body-strong">→</text>
    <text x="819" y="815" class="body-strong">apply inline / fetch CIDs</text>
    <text x="240" y="842" class="body">Fetched stored blocks: CID validation → decrypt → deserialize; no per-block writer authentication.</text>
  </g>
</svg>

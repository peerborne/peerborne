    <text x="50" y="99" class="subtitle">Signing identity, KEM identity, and libp2p transport identity are separate concerns.</text>

    <text x="50" y="143" class="eyebrow" fill="#a3efb8">THREE SEPARATE KEY OR IDENTITY ROLES</text>
    <rect x="50" y="163" width="340" height="138" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="74" y="198" class="card-title">Writer signing identity</text>
    <text x="74" y="225" class="body-strong">ECDSA P-384 key pair</text>
    <text x="74" y="251" class="body">Application supplied and stored</text>
<text x="0" y="0" class="body" transform="translate(74 274) scale(0.87719 1)">Authenticates signed document messages</text>
    <rect x="430" y="163" width="340" height="138" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="454" y="198" class="card-title">Reader onboarding identity</text>
    <text x="454" y="225" class="body-strong">ECDH P-256 KEM key pair</text>
    <text x="454" y="251" class="body">Application supplied and stored</text>
<text x="0" y="0" class="body" transform="translate(454 274) scale(0.95238 1)">Opens recipient-sealed Welcome data</text>
    <rect x="810" y="163" width="340" height="138" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="834" y="198" class="card-title">Transport identity</text>
    <text x="834" y="225" class="body-strong">libp2p Peer ID</text>
    <text x="834" y="251" class="body">Owned by the libp2p transport</text>
<text x="0" y="0" class="body" transform="translate(834 274) scale(0.87719 1)">Separate from application signing keys</text>

    <rect x="50" y="329" width="1100" height="132" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="74" y="363" class="eyebrow" fill="#b7a1ff">DOCUMENT-SCOPED STATE</text>
    <text x="0" y="0" class="card-title" transform="translate(74 397) scale(0.91009 1)">Document encryption keys</text>
    <text x="333" y="397" class="body">AES-GCM by default</text>
    <text x="0" y="0" class="card-title" transform="translate(590 397) scale(0.95106 1)">Reader / writer ACL</text>
    <text x="806" y="397" class="body">Bound to signing public keys</text>
    <rect x="74" y="414" width="442" height="34" fill="#382237" stroke="#f0a5cf" stroke-width="1.5"/>
    <text x="295" y="437" class="badge" text-anchor="middle" fill="#f0a5cf">NO SIGNING-KEY → PEER-ID MAP</text>
    <text x="0" y="0" class="body" transform="translate(540 438) scale(0.88000 1)">Applications own enrollment, private-key persistence, backup, and recovery.</text>
    <path d="M220 301V321" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M600 301V321" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M980 301V321" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <text x="50" y="508" class="eyebrow" fill="#ffb887">PER-CHANGE ARTIFACTS</text>
    <rect x="50" y="530" width="520" height="222" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="76" y="565" class="card-title">CID-addressed stored payload</text>
    <text x="76" y="595" class="body">Serialized CRDT change</text>
<text x="76" y="621" class="body">→ encrypted with the document key</text>
<text x="76" y="647" class="body">→ stored as opaque bytes in Helia</text>
<text x="76" y="673" class="body">→ CID addresses the complete byte frame</text>
    <rect x="76" y="696" width="412" height="34" fill="#382237" stroke="#f0a5cf" stroke-width="1.5"/>
    <text x="282" y="719" class="badge" text-anchor="middle" fill="#f0a5cf">NO BLOCK SIGNATURE OR ACL DECISION</text>

    <rect x="630" y="530" width="520" height="222" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="656" y="565" class="card-title">Separate GossipSub envelope</text>
    <text x="656" y="595" class="body">CRDTSyncMessage names the new CID</text>
<text x="656" y="621" class="body">→ signed with P-384 when signing is enabled</text>
<text x="656" y="647" class="body">→ serialized and encrypted with document key</text>
<text x="656" y="673" class="body">→ full encrypted envelope is published</text>
    <rect x="656" y="696" width="362" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="837" y="719" class="badge" text-anchor="middle" fill="#c7f5d3">SIGNATURE COVERS WIRE MESSAGE</text>

    <rect x="50" y="781" width="1100" height="89" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="74" y="815" class="eyebrow" fill="#b7a1ff">RECEIVER ORDER</text>
    <text x="0" y="0" class="body-strong" transform="translate(240 815) scale(0.83333 1)">decrypt + deserialize envelope</text>
    <text x="475" y="815" class="body-strong">→</text>
    <text x="0" y="0" class="body-strong" transform="translate(507 815) scale(0.85714 1)">verify known writer when applicable</text>
    <text x="787" y="815" class="body-strong">→</text>
    <text x="819" y="815" class="body-strong">apply inline / fetch CIDs</text>
    <text x="240" y="842" class="body">Fetched stored blocks: CID validation → decrypt → deserialize; no per-block writer authentication.</text>
  </g>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

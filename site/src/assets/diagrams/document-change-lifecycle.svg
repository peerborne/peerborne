    <text x="50" y="99" class="subtitle">Core delegates the local mutation to CRDTProvider.localChange before creating storage and wire artifacts.</text>

    <rect x="916" y="51" width="234" height="34" fill="#382237" stroke="#f0a5cf" stroke-width="1.5"/>
    <text x="1033" y="74" class="badge" text-anchor="middle" fill="#f0a5cf">LOCAL MUTATION FIRST</text>
    <g filter="url(#shadow)">
      <rect x="50" y="145" width="300" height="116" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    </g>
    <rect x="61" y="158" width="32" height="32" fill="#b7a1ff"/>
    <text x="77" y="175" class="number">1</text>
    <text x="102" y="179" class="card-title">document.change(fn)</text>
    <text x="0" y="0" class="body" transform="translate(72 214) scale(0.74644 1)">Application supplies a change callback.</text>
    <g filter="url(#shadow)">
      <rect x="450" y="145" width="300" height="116" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    </g>
    <rect x="461" y="158" width="32" height="32" fill="#b7a1ff"/>
    <text x="477" y="175" class="number">2</text>
    <text x="502" y="179" class="card-title">Authorize the write</text>
    <text x="0" y="0" class="body" transform="translate(472 214) scale(0.88215 1)">Current writer access is checked.</text>
    <g filter="url(#shadow)">
      <rect x="850" y="145" width="300" height="116" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <rect x="861" y="158" width="32" height="32" fill="#a3efb8"/>
    <text x="877" y="175" class="number">3</text>
    <text x="902" y="179" class="card-title">CRDTProvider</text>
    <text x="0" y="0" class="body" transform="translate(872 214) scale(0.85621 1)">localChange(document, message, fn)</text>
<text x="0" y="0" class="body" transform="translate(872 237) scale(0.69312 1)">runs the callback at the adapter boundary.</text>
    <path d="M350 203H442" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M750 203H842" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <g filter="url(#shadow)">
      <rect x="850" y="320" width="300" height="116" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <rect x="861" y="333" width="32" height="32" fill="#a3efb8"/>
    <text x="877" y="350" class="number">4</text>
    <text x="0" y="0" class="card-title" transform="translate(902 354) scale(0.96909 1)">Local replica changes</text>
    <text x="0" y="0" class="body" transform="translate(872 389) scale(0.78679 1)">Provider returns the updated document</text>
<text x="0" y="0" class="body" transform="translate(872 412) scale(0.83175 1)">and a provider-specific CRDT delta.</text>
    <g filter="url(#shadow)">
      <rect x="450" y="320" width="300" height="116" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    </g>
    <rect x="461" y="333" width="32" height="32" fill="#b7a1ff"/>
    <text x="477" y="350" class="number">5</text>
    <text x="502" y="354" class="card-title">Serialize + encrypt</text>
    <text x="0" y="0" class="body" transform="translate(472 389) scale(0.85621 1)">Serialize the provider delta, then</text>
<text x="0" y="0" class="body" transform="translate(472 412) scale(0.97037 1)">encrypt with the document key.</text>
    <g filter="url(#shadow)">
      <rect x="50" y="320" width="300" height="116" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    </g>
    <rect x="61" y="333" width="32" height="32" fill="#b7a1ff"/>
    <text x="77" y="350" class="number">6</text>
    <text x="102" y="354" class="card-title">Store bytes in Helia</text>
    <text x="0" y="0" class="body" transform="translate(72 389) scale(0.88215 1)">Content addressing returns a CID.</text>
    <path d="M1000 261V312" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M850 378H758" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M450 378H358" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <g filter="url(#shadow)">
      <rect x="50" y="495" width="300" height="116" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    </g>
    <rect x="61" y="508" width="32" height="32" fill="#b7a1ff"/>
    <text x="77" y="525" class="number">7</text>
    <text x="0" y="0" class="card-title" transform="translate(102 529) scale(0.96909 1)">Build CRDTSyncMessage</text>
    <text x="0" y="0" class="body" transform="translate(72 564) scale(0.80864 1)">Name the CID; include inline history</text>
<text x="72" y="587" class="body">and deferred CID references.</text>
    <g filter="url(#shadow)">
      <rect x="450" y="495" width="300" height="116" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <rect x="461" y="508" width="32" height="32" fill="#a3efb8"/>
    <text x="477" y="525" class="number">8</text>
    <text x="502" y="529" class="card-title">Protect wire message</text>
    <text x="0" y="0" class="body" transform="translate(472 564) scale(0.85621 1)">Sign when enabled, serialize, then</text>
<text x="0" y="0" class="body" transform="translate(472 587) scale(0.97037 1)">encrypt with the document key.</text>
    <g filter="url(#shadow)">
      <rect x="850" y="495" width="300" height="116" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    </g>
    <rect x="861" y="508" width="32" height="32" fill="#a3efb8"/>
    <text x="877" y="525" class="number">9</text>
    <text x="0" y="0" class="card-title" transform="translate(902 529) scale(0.96909 1)">Publish full envelope</text>
    <text x="0" y="0" class="body" transform="translate(872 564) scale(0.78679 1)">Send to the document GossipSub topic;</text>
<text x="0" y="0" class="body" transform="translate(872 587) scale(0.80864 1)">this is not a CID-only announcement.</text>
    <path d="M200 436V487" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M350 553H442" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M750 553H842" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="50" y="670" width="1100" height="107" fill="#382237" stroke="#f0a5cf" stroke-width="2"/>
    <text x="76" y="705" class="eyebrow" fill="#f0a5cf">FAILURE BOUNDARY</text>
    <text x="0" y="0" class="body-strong" transform="translate(270 705) scale(0.98969 1)">The local replica changes during CRDTProvider.localChange, before storage and publication finish.</text>
    <text x="76" y="737" class="body">A later storage or publication error can reject change() while the mutation remains visible locally.</text>
    <text x="76" y="762" class="body">There is no automatic rollback, durable outbox, or remote delivery receipt.</text>
  </g>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

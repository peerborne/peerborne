  <text x="54" y="128" class="subheading">Capture trusted writers, security commitments, and a fresh challenge before probing.</text>

  <g filter="url(#shadow)">
    <rect x="46" y="158" width="220" height="112" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <rect x="56" y="170" width="30" height="30" fill="#a3efb8"/><text x="71" y="186" class="number">1</text>
    <text x="0" y="0" class="step" transform="translate(96 191) scale(0.95062 1)">document.open()</text>
    <text x="68" y="218" class="detail">Attempts a remote</text>
    <text x="68" y="239" class="detail">load from currently</text>
    <text x="68" y="260" class="detail">connected peers.</text>

    <rect x="318" y="158" width="250" height="112" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <rect x="328" y="170" width="30" height="30" fill="#cbc5d6"/><text x="343" y="186" class="number">2</text>
    <text x="0" y="0" class="step" transform="translate(368 191) scale(0.74074 1)">If enabled: probe peers</text>
    <text x="0" y="0" class="detail" transform="translate(340 226) scale(0.73611 1)">Up to effective K distinct peers</text>
    <text x="0" y="0" class="detail" transform="translate(340 249) scale(0.75986 1)">sign complete response digests.</text>

    <rect x="620" y="146" width="534" height="136" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <rect x="632" y="160" width="30" height="30" fill="#b7a1ff"/><text x="647" y="176" class="number">3</text>
    <text x="674" y="181" class="step">Configured remote-load mode</text>
    <text x="0" y="0" class="detail" transform="translate(646 216) scale(0.85417 1)">Enabled: Q trusted signing authorities must agree on one digest.</text>
    <text x="646" y="242" class="detail">Disabled: select one authenticated V4 response.</text>
    <text x="0" y="0" class="detail" transform="translate(646 265) scale(0.91111 1)">Each signing authority counts once across transport PeerIds.</text>
  </g>
  <path d="M 266 214 H 312 M 568 214 H 614" fill="none" stroke="#a7a0b6" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="44" y="312" width="1112" height="242" fill="#242136" stroke="#756c89" stroke-width="2"/>
  <text x="68" y="343" class="eyebrow" fill="#b7a1ff">QUORUM PATH · ORDER BEFORE STATE MUTATION</text>
  <g filter="url(#shadow)">
    <rect x="68" y="365" width="290" height="114" fill="#242136" stroke="#756c89"/>
    <rect x="78" y="377" width="30" height="30" fill="#b7a1ff"/><text x="93" y="393" class="number">4</text>
    <text x="0" y="0" class="step" transform="translate(118 398) scale(0.94276 1)">Decrypt response first</text>
    <text x="90" y="425" class="detail">Select held/restored key,</text>
    <text x="90" y="446" class="detail">decrypt, then deserialize</text>
    <text x="90" y="467" class="detail">the sync message.</text>

    <rect x="399" y="365" width="344" height="114" fill="#242136" stroke="#756c89"/>
    <rect x="409" y="377" width="30" height="30" fill="#b7a1ff"/><text x="424" y="393" class="number">5</text>
    <text x="449" y="398" class="step">Authenticate every load</text>
    <text x="421" y="433" class="detail">Verify a captured trusted writer;</text>
    <text x="0" y="0" class="detail" transform="translate(421 456) scale(0.80952 1)">check the fresh challenge and local tuple.</text>

    <rect x="784" y="365" width="348" height="114" fill="#242136" stroke="#b7a1ff"/>
    <rect x="794" y="377" width="30" height="30" fill="#b7a1ff"/><text x="809" y="393" class="number">6</text>
    <text x="834" y="398" class="step">Bind the response manifest</text>
    <text x="0" y="0" class="detail" transform="translate(806 433) scale(0.90643 1)">Derive the graph, state, and frontier;</text>
    <text x="0" y="0" class="detail" transform="translate(806 456) scale(0.98413 1)">compare the complete agreed digest.</text>
  </g>
  <path d="M 358 422 H 393 M 743 422 H 778" fill="none" stroke="#a7a0b6" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="68" y="498" width="1064" height="38" fill="#382237" stroke="#f0a5cf" stroke-opacity="0.65"/>
  <text x="600" y="523" fill="#f0a5cf" font-size="15" text-anchor="middle">First load: independently pin trusted writers; quorum replay still requires available change history.</text>

  <rect x="44" y="578" width="1112" height="160" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
  <text x="68" y="609" class="eyebrow" fill="#a3efb8">QUORUM-BOUND HISTORY FETCH + MATERIALIZATION</text>
  <g>
    <rect x="76" y="636" width="32" height="32" fill="#a3efb8"/><text x="92" y="653" class="number">7</text>
    <text x="119" y="646" class="step">Prefetch changes-tree CIDs</text>
    <text x="0" y="0" class="detail" transform="translate(119 672) scale(0.95664 1)">Strip inline changes, then fetch each CID</text>
    <text x="119" y="694" class="detail">enumerated by the served changes tree.</text>

    <rect x="439" y="636" width="32" height="32" fill="#a3efb8"/><text x="455" y="653" class="number">8</text>
    <text x="482" y="646" class="step">CID-validate fetched bytes</text>
    <text x="0" y="0" class="detail" transform="translate(482 672) scale(0.99483 1)">Helia validates ciphertext during prefetch;</text>
    <text x="482" y="694" class="detail">decryption happens later inside sync.</text>

    <rect x="834" y="636" width="32" height="32" fill="#a3efb8"/><text x="850" y="653" class="number">9</text>
    <text x="877" y="646" class="step">Decrypt + apply history</text>
    <text x="0" y="0" class="detail" transform="translate(877 672) scale(0.94265 1)">sync builds from cached blocks;</text>
    <text x="0" y="0" class="detail" transform="translate(877 694) scale(0.91319 1)">a later failure has no rollback.</text>
  </g>
  <path d="M 395 652 H 429 M 790 652 H 824" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="600" y="723" fill="#c7f5d3" font-size="13" text-anchor="middle">CID checks bind ciphertext; the signed manifest binds graph and state. Control-log replay is not integrated.</text>

  <rect x="44" y="762" width="420" height="54" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
  <text x="254" y="796" class="result" fill="#c7f5d3" text-anchor="middle">Ready · local mutations may begin</text>
  <rect x="488" y="762" width="668" height="54" fill="#382237" stroke="#f0a5cf" stroke-width="2"/>
  <text x="822" y="786" class="result" fill="#f0a5cf" text-anchor="middle">Fail · trust, challenge, signature, digest, or history error</text>
  <text x="0" y="0" fill="#f0a5cf" font-size="14" text-anchor="middle" transform="translate(822 806) scale(0.94378 1)">failure never creates a document; later application failure may leave partial state</text>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Peerborne remote initial document load</title>
  <desc id="desc">V4 loads capture locally trusted writers, control/group commitments, and a fresh challenge. Authenticated authorities agree on a complete response digest. The selected signed response must match that challenge, tuple, and digest before application. Disabling quorum permits one authenticated V4 source. Creating a document always requires an explicit application decision.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#a7a0b6"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#a3efb8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0c0b13" flood-opacity="1"/></filter>

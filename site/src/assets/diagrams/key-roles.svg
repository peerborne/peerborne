      <rect x="24" y="21" width="240" height="44" fill="#30234c" stroke="#b7a1ff" />
      <text x="144" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#d6c8ff">ECDSA signing identity</text>
      <path d="M264 43H326M326 43V27H382M326 43V59H382" fill="none" stroke="#b7a1ff" stroke-width="2.5" />
      <rect x="382" y="10" width="116" height="34" fill="#242136" stroke="#756c89" />

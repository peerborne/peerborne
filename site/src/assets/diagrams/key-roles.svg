    <text x="600" y="382" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.4" fill="#b7a1ff">SEPARATE IDENTITIES</text>

    <g transform="translate(52 402)">
      <rect width="530" height="166" fill="#1b382a" stroke="#a3efb8" stroke-width="2" />
      <text class="eyebrow" x="26" y="34" fill="#a3efb8">KEY SHARING</text>
      <text class="card-title" x="26" y="72">KEM identity</text>
      <text class="algorithm" x="26" y="101" fill="#c7f5d3">ECDH P-256</text>
      <text class="purpose" x="0" y="0" transform="translate(26 132) scale(0.85614 1)">Opens recipient-sealed Welcome onboarding payloads</text>
      <text class="owner" x="504" y="34" text-anchor="end">APPLICATION-SUPPLIED</text>
    </g>

    <g transform="translate(618 402)">
      <rect width="530" height="166" fill="#1b382a" stroke="#a3efb8" stroke-width="2" />
      <text class="eyebrow" x="26" y="34" fill="#a3efb8">CONTENT ENCRYPTION</text>
      <text class="card-title" x="26" y="72">Document key</text>
      <text class="algorithm" x="26" y="101" fill="#c7f5d3">AES-GCM · 256-bit default</text>
      <text class="purpose" x="0" y="0" transform="translate(26 132) scale(0.97289 1)">Encrypts and decrypts one document’s content</text>
      <text class="owner" x="504" y="34" text-anchor="end">PER DOCUMENT</text>
    </g>
    <line x1="582" y1="485" x2="614" y2="485" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrow)" />

    <g transform="translate(52 596)">

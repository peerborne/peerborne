      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.2px; }
      .card-title { font-size: 27px; font-weight: 750; fill: #f5f0e8; }
      .algorithm { font-size: 18px; font-weight: 650; fill: #d6c8ff; }
      .purpose { font-size: 19px; font-weight: 500; fill: #cbc5d6; }
      .owner { font-size: 16px; font-weight: 650; fill: #a7a0b6; }
      .chip { font-size: 15px; font-weight: 750; letter-spacing: 1.2px; }
    </style>
  </defs>


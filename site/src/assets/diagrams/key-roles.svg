    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a7a0b6" stroke-opacity="0.045" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0H3V2H6V4H9V6H6V8H3V10H0Z" fill="#a3efb8" />
    </marker>

      <text x="440" y="71" text-anchor="middle" font-size="16" font-weight="700" fill="#cbc5d6">Peer node B</text>
      <text x="540" y="38" font-size="20" font-weight="700" fill="#f5f0e8">One signing identity may span nodes</text>
      <text x="540" y="62" font-size="16" font-weight="500" fill="#a7a0b6">Each node still has its own libp2p transport identity.</text>
    </g>
  </g>

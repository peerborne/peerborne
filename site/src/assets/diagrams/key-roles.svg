<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Peerborne key roles</title>
  <desc id="description">Four cards distinguish the application-supplied ECDSA signing identity, the application-supplied ECDH KEM identity used for recipient-sealed Welcome onboarding, the per-document content key using AES-GCM by default, and the libp2p peer ID, whose transport key uses an upstream-generated default unless configured. Ordinary document sync signing is configurable, BeeKEM membership-control messages remain writer-signed, content encryption is always on, and one signing identity can be used across multiple peer nodes.</desc>

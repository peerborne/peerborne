      <text class="algorithm" x="26" y="101">ECDSA P-384</text>
      <text class="purpose" x="0" y="0" transform="translate(26 132) scale(0.83935 1)">Authenticates an authorized document-message signer</text>
      <text class="owner" x="504" y="34" text-anchor="end">APPLICATION-SUPPLIED</text>
    </g>

    <g transform="translate(618 198)">
      <rect width="530" height="166" fill="#242136" stroke="#756c89" stroke-width="2" />
      <text class="eyebrow" x="26" y="34" fill="#a7a0b6">TRANSPORT IDENTITY</text>
      <text class="card-title" x="26" y="72">libp2p peer ID</text>
      <text class="algorithm" x="26" y="101" fill="#c7f5d3">Upstream default</text>
      <text class="purpose" x="26" y="132">Identifies a node on the libp2p network</text>
      <text class="owner" x="504" y="34" text-anchor="end">DEFAULT-GENERATED</text>
    </g>

    <g transform="translate(600 281)">
      <rect x="-25" y="-25" width="50" height="50" fill="#171521" stroke="#b7a1ff" stroke-width="2"/>

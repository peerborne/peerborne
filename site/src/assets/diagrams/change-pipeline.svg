  <text x="54" y="128" class="subheading">The stored block and the GossipSub envelope have different integrity and authorization checks.</text>

  <rect x="44" y="154" width="1112" height="174" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
  <text x="68" y="183" class="eyebrow" fill="#b7a1ff">A · ENCRYPTED, CID-ADDRESSED STORAGE ARTIFACT</text>

  <g filter="url(#shadow)">
    <rect x="68" y="202" width="226" height="98" fill="#242136" stroke="#756c89"/>
    <rect x="76" y="210" width="30" height="30" fill="#b7a1ff"/><text x="91" y="226" class="number">1</text>
    <text x="0" y="0" class="step" transform="translate(114 230) scale(0.79922 1)">Local CRDT mutation</text>
    <text x="88" y="263" class="detail">produces change bytes</text>

    <rect x="336" y="202" width="226" height="98" fill="#242136" stroke="#756c89"/>
    <rect x="344" y="210" width="30" height="30" fill="#b7a1ff"/><text x="359" y="226" class="number">2</text>
    <text x="0" y="0" class="step" transform="translate(382 230) scale(0.89325 1)">Serialize payload</text>
    <text x="0" y="0" class="detail" transform="translate(356 263) scale(0.70370 1)">change data, not sync envelope</text>

    <rect x="604" y="202" width="226" height="98" fill="#242136" stroke="#756c89"/>
    <rect x="612" y="210" width="30" height="30" fill="#b7a1ff"/><text x="627" y="226" class="number">3</text>
    <text x="650" y="230" class="step">Encrypt payload</text>
    <text x="624" y="263" class="detail">with the document key</text>

    <rect x="872" y="202" width="260" height="98" fill="#242136" stroke="#b7a1ff"/>
    <rect x="880" y="210" width="30" height="30" fill="#b7a1ff"/><text x="895" y="226" class="number">4</text>
    <text x="918" y="230" class="step">Store ciphertext</text>
    <text x="0" y="0" class="detail" transform="translate(892 259) scale(0.73203 1)">Helia returns its content ID (CID)</text>
    <text x="0" y="0" class="detail" transform="translate(892 280) scale(0.73203 1)">for later references and retrieval</text>
  </g>
  <path d="M 294 251 H 330 M 562 251 H 598 M 830 251 H 866" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

  <rect x="44" y="350" width="1112" height="180" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
  <text x="68" y="379" class="eyebrow" fill="#a3efb8">B · SEPARATE GOSSIPSUB WIRE ARTIFACT</text>

  <g filter="url(#shadow)">
    <rect x="68" y="398" width="294" height="104" fill="#1b382a" stroke="#a3efb8"/>
    <rect x="76" y="406" width="30" height="30" fill="#a3efb8"/><text x="91" y="422" class="number">5</text>
    <text x="114" y="426" class="step">Build CRDTSyncMessage</text>
    <text x="88" y="455" class="detail">new CID + inline change tree</text>
    <text x="88" y="477" class="detail">+ deferred CID references</text>

    <rect x="405" y="398" width="212" height="104" fill="#1b382a" stroke="#a3efb8"/>
    <rect x="413" y="406" width="30" height="30" fill="#a3efb8"/><text x="428" y="422" class="number">6</text>
    <text x="0" y="0" class="step" transform="translate(451 426) scale(0.92593 1)">Sign if enabled</text>
    <text x="0" y="0" class="detail" transform="translate(425 455) scale(0.97778 1)">signature covers the</text>
    <text x="425" y="477" class="detail">entire sync message</text>

    <rect x="660" y="398" width="214" height="104" fill="#1b382a" stroke="#a3efb8"/>
    <rect x="668" y="406" width="30" height="30" fill="#a3efb8"/><text x="683" y="422" class="number">7</text>
    <text x="0" y="0" class="step" transform="translate(706 426) scale(0.74074 1)">Serialize + encrypt</text>
    <text x="0" y="0" class="detail" transform="translate(680 455) scale(0.94180 1)">document-key envelope</text>
    <text x="680" y="477" class="detail">AES-GCM by default</text>

    <rect x="917" y="398" width="215" height="104" fill="#1b382a" stroke="#a3efb8"/>
    <rect x="925" y="406" width="30" height="30" fill="#a3efb8"/><text x="940" y="422" class="number">8</text>
    <text x="0" y="0" class="step" transform="translate(963 426) scale(0.88542 1)">Publish envelope</text>
    <text x="0" y="0" class="detail" transform="translate(937 455) scale(0.90404 1)">full encrypted message</text>
    <text x="0" y="0" class="detail" transform="translate(937 477) scale(0.73663 1)">over GossipSub—not CID-only</text>
  </g>
  <path d="M 362 450 H 399 M 617 450 H 654 M 874 450 H 911" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <rect x="44" y="552" width="1112" height="140" fill="#242136" stroke="#756c89" stroke-width="2"/>
  <text x="68" y="581" class="eyebrow" fill="#b7a1ff">REMOTE DEVICE · ORDERED CHECKS</text>
  <g>
    <rect x="76" y="604" width="32" height="32" fill="#b7a1ff"/><text x="92" y="621" class="number">9</text>
    <text x="119" y="616" class="step">Decrypt envelope first</text>
    <text x="119" y="640" class="detail">then deserialize the sync message</text>

    <rect x="414" y="604" width="32" height="32" fill="#b7a1ff"/><text x="430" y="621" class="number">10</text>
    <text x="457" y="610" class="step">Authorize known writer</text>
    <text x="457" y="634" class="detail">verify outer signature + writer ACL</text>
    <text x="0" y="0" class="detail" transform="translate(457 655) scale(0.92346 1)">when signing is enabled and writers are known</text>

    <rect x="798" y="604" width="32" height="32" fill="#b7a1ff"/><text x="814" y="621" class="number">11</text>
    <text x="841" y="610" class="step">Apply inline history</text>
    <text x="0" y="0" class="detail" transform="translate(841 634) scale(0.92284 1)">Fetch only missing or deferred CIDs.</text>
    <text x="0" y="0" class="detail" transform="translate(841 655) scale(0.75505 1)">CID check → decrypt → deserialize and apply.</text>
  </g>
  <path d="M 374 620 H 404 M 758 620 H 788" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

  <rect x="44" y="710" width="1112" height="30" fill="#382237"/>
  <text x="0" y="0" class="footer" text-anchor="middle" transform="translate(600 731) scale(0.83296 1)">Failure boundary: a local mutation can remain visible if later storage or publish fails; there is no rollback, durable outbox, or delivery receipt.</text>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>

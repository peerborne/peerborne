    <text x="50" y="99" class="subtitle">Indexes are rebuildable materialized projections of authorized, decrypted local document state.</text>

    <rect x="886" y="51" width="264" height="34" fill="#1b382a" stroke="#a3efb8" stroke-width="1.5"/>
    <text x="1018" y="74" class="badge" text-anchor="middle" fill="#c7f5d3">LOCAL PROJECTION ONLY</text>

    <rect x="180" y="137" width="840" height="72" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="600" y="168" class="card-title" text-anchor="middle">Authorized, decrypted CRDT snapshot</text>
    <text x="600" y="193" class="body" text-anchor="middle">Source state already available to the local application</text>
    <path d="M600 209V239" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="180" y="247" width="840" height="94" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="600" y="280" class="card-title" text-anchor="middle">IndexManager validation and normalization</text>
    <text x="600" y="308" class="body" text-anchor="middle">Schema generation · field types · invalid-value policy · storage policy</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(600 330) scale(0.96065 1)">Malformed values fail or skip according to the index definition; values stay out of diagnostics.</text>

    <path d="M600 341V374H280V392" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M600 341V374H920V392" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <rect x="80" y="400" width="400" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="280" y="436" class="card-title" text-anchor="middle">Named compound physical keys</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(280 464) scale(0.88435 1)">Leading equality fields, then one range or prefix</text>
<text x="280" y="487" class="body" text-anchor="middle">Required fields only for physical keys</text>
    <rect x="720" y="400" width="400" height="112" fill="#30234c" stroke="#b7a1ff" stroke-width="2"/>
    <text x="920" y="436" class="card-title" text-anchor="middle">Stored indexed fields</text>
    <text x="0" y="0" class="body" text-anchor="middle" transform="translate(920 464) scale(0.86667 1)">Local projection for predicate rechecks and output</text>
<text x="0" y="0" class="body" text-anchor="middle" transform="translate(920 487) scale(0.83333 1)">Memory by default; cleartext persistence is explicit</text>

    <path d="M280 512V550H455V568" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <path d="M920 512V550H745V568" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>
    <rect x="220" y="576" width="760" height="86" fill="#242136" stroke="#756c89" stroke-width="2"/>
    <text x="600" y="610" class="card-title" text-anchor="middle">Query planner</text>
    <text x="600" y="638" class="body" text-anchor="middle">Select a physical key or require an explicit full scan; record residual predicates.</text>
    <path d="M600 662V694" fill="none" stroke="#b7a1ff" stroke-width="3" marker-end="url(#arrowIndigo)"/>

    <rect x="220" y="702" width="760" height="72" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="600" y="733" class="card-title" text-anchor="middle">Candidate range, union, or approved full scan</text>
    <text x="600" y="758" class="body" text-anchor="middle">Physical lookup narrows work; it never decides the final result by itself.</text>
    <path d="M600 774V806" fill="none" stroke="#a3efb8" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="80" y="814" width="1040" height="84" fill="#1b382a" stroke="#a3efb8" stroke-width="2"/>
    <text x="600" y="847" class="card-title" text-anchor="middle">Full predicate recheck</text>
    <text x="600" y="875" class="body" text-anchor="middle">Then deterministic sort, cursor validation, count, and projection for the bounded local result.</text>
  </g>
<path d="M0 0H1200V8H0Z" fill="#a3efb8"/>
</svg>
